<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Syailun Trans — Sewa Kendaraan</title>
<meta name="description" content="Sewa motor, mobil, dan minibus. Lepas kunci atau dengan sopir.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#061C24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Syailun Trans">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5F0; --surface:#FFFFFF; --surface-2:#F3F4F6; --sand:#E9E1D4; --blue-soft:#EAF1F8;
  --ink:#202B36; --ink-2:#344253; --muted:#5F6B78; --line:#E4E1DA;
  --navy:#202B36; --slate:#344253; --gold:#B69A70; --gold-ink:#7A6342; --sage:#8E9B8B;
  --primary:#202B36; --on-primary:#FFFFFF; --hero-bg:#F7F5F0;
  --success:#1E7A4C; --success-bg:#E5F3EC; --warning:#8A5A00; --warning-bg:#FBF0DC; --error:#B42318; --error-bg:#FDECEA;
  --shadow:0 1px 2px rgba(32,43,54,.05), 0 10px 28px -16px rgba(32,43,54,.22);
  --shadow-lg:0 24px 60px -28px rgba(32,43,54,.35);
  --r-card:20px; --r-btn:14px; --r-in:12px;
  --font:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171E; --surface:#18212B; --surface-2:#202A35; --sand:#2E2B25; --blue-soft:#1C2836;
    --ink:#ECEEF1; --ink-2:#C9D0D8; --muted:#9BA6B2; --line:#2A3542;
    --navy:#0D141B; --primary:#E9E1D4; --on-primary:#202B36; --gold:#C9AE84; --gold-ink:#D8BF96; --hero-bg:#11171E;
    --success:#5CC795; --success-bg:#16301F; --warning:#E3B04B; --warning-bg:#33270F; --error:#F08A7E; --error-bg:#3A1A17;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.6); --shadow-lg:0 24px 60px -28px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11171E; --surface:#18212B; --surface-2:#202A35; --sand:#2E2B25; --blue-soft:#1C2836;
  --ink:#ECEEF1; --ink-2:#C9D0D8; --muted:#9BA6B2; --line:#2A3542;
  --navy:#0D141B; --primary:#E9E1D4; --on-primary:#202B36; --gold:#C9AE84; --gold-ink:#D8BF96; --hero-bg:#11171E;
  --success:#5CC795; --success-bg:#16301F; --warning:#E3B04B; --warning-bg:#33270F; --error:#F08A7E; --error-bg:#3A1A17;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.6); --shadow-lg:0 24px 60px -28px rgba(0,0,0,.8);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
img,svg{max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em;line-height:1.15}
h1{font-size:clamp(2.2rem,5.4vw,3.9rem);font-weight:700;letter-spacing:-.035em}
h2{font-size:clamp(1.6rem,3vw,2.15rem);font-weight:700}
h3{font-size:1.15rem;font-weight:650}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.8rem;font-weight:600;color:var(--gold-ink);letter-spacing:.02em}
.sec{padding:56px 0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sec-head p{margin-top:6px;max-width:60ch}
.link{background:none;border:0;padding:0;color:var(--ink);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--gold)}

/* Demo banner + header */
.demo{background:var(--sand);color:var(--ink);font-size:.82rem;text-align:center;padding:7px 16px}
.demo b{font-weight:650}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:750;letter-spacing:.08em;font-size:.98rem;white-space:nowrap;cursor:pointer;background:none;border:0;padding:0}
.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--navy);color:var(--gold);display:grid;place-items:center}
:root[data-theme="dark"] .brand-mark{background:var(--surface-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand-mark{background:var(--surface-2)}}
.nav{display:flex;gap:2px;margin-left:12px}
.nav a{text-decoration:none;padding:9px 13px;border-radius:10px;font-weight:550;font-size:.94rem;color:var(--ink-2)}
.nav a:hover{background:var(--surface-2)}
.nav a.on{color:var(--ink);background:var(--surface-2)}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.icon-btn{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--surface-2)}
.count{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--gold);color:#202B36;font-size:.7rem;font-weight:700;display:grid;place-items:center}
@media (max-width:860px){.nav,.hide-m{display:none !important}}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--r-btn);border:1px solid transparent;font-weight:600;font-size:.96rem;cursor:pointer;text-decoration:none;transition:transform .12s ease,background .2s,box-shadow .2s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{box-shadow:0 8px 22px -10px rgba(32,43,54,.55)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-gold{background:var(--gold);color:#1B232C}
.btn-ghost{background:transparent;color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--error-bg);color:var(--error)}
.btn-sm{min-height:38px;padding:0 14px;border-radius:11px;font-size:.88rem}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.field{width:100%;min-height:48px;padding:11px 14px;border:1.5px solid var(--line);border-radius:var(--r-in);background:var(--surface);min-width:0;transition:border-color .2s,box-shadow .2s}
textarea.field{min-height:88px;resize:vertical}
.field:focus{outline:none;border-color:var(--ink-2);box-shadow:0 0 0 4px var(--blue-soft)}
.field.invalid{border-color:var(--error);box-shadow:0 0 0 4px var(--error-bg)}
label.l{display:block;font-size:.86rem;font-weight:600;margin-bottom:7px;color:var(--ink-2)}
.hint{font-size:.82rem;color:var(--muted);margin-top:6px}
.ferr{font-size:.84rem;color:var(--error);margin-top:6px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.stack{display:grid;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.choice{display:flex;gap:12px;align-items:flex-start;padding:16px;border:1.5px solid var(--line);border-radius:16px;cursor:pointer;background:var(--surface);transition:border-color .2s,background .2s}
.choice:hover{border-color:var(--ink-2)}
.choice:has(input:checked){border-color:var(--ink);background:var(--blue-soft)}
.choice input{margin-top:3px;width:18px;height:18px;accent-color:var(--ink);flex:none}
.choice b{display:block;font-weight:650}
.choice small{display:block;color:var(--muted);font-size:.86rem;margin-top:2px}
.choice .price{margin-left:auto;font-weight:650;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:550;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-size:.78rem;opacity:.7}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;min-height:38px;padding:0 14px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow)}
.pad{padding:22px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:650;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.badge.ok{background:var(--success-bg);color:var(--success)}
.badge.warn{background:var(--warning-bg);color:var(--warning)}
.badge.err{background:var(--error-bg);color:var(--error)}
.badge.info{background:var(--blue-soft);color:var(--ink-2)}
.badge.gold{background:var(--sand);color:var(--gold-ink)}
.alert{display:flex;gap:12px;padding:14px 16px;border-radius:14px;font-size:.92rem;align-items:flex-start}
.alert svg{flex:none;margin-top:2px}
.alert.info{background:var(--blue-soft)}
.alert.warn{background:var(--warning-bg);color:var(--warning)}
.alert.err{background:var(--error-bg);color:var(--error)}
.alert.ok{background:var(--success-bg);color:var(--success)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ei{width:64px;height:64px;border-radius:20px;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 14px;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:6px}
.empty p{max-width:42ch;margin:0 auto 16px}

/* Hero */
.hero{background:var(--hero-bg);padding:48px 0 28px;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:center}
.hero h1 span{color:var(--gold-ink)}
.hero .lead{font-size:1.12rem;color:var(--ink-2);margin:18px 0 0;max-width:46ch}
.hero-img{position:relative;aspect-ratio:16/10}
.hero-img::before{content:"";position:absolute;inset:12% 2% 4% 8%;border-radius:40px;background:linear-gradient(160deg,var(--sand),var(--blue-soft))}
.hero-img img{position:relative;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero-img img{mix-blend-mode:normal;border-radius:28px}}
:root[data-theme="dark"] .hero-img img{mix-blend-mode:normal;border-radius:28px}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}.hero-img{display:none}.hero{padding-top:32px}}
.search{margin-top:28px;padding:10px;display:grid;grid-template-columns:1.1fr 1fr 1fr .9fr auto;gap:6px;align-items:stretch;border-radius:24px}
.search .sf{padding:10px 14px;border-radius:16px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.search .sf:hover{background:var(--surface-2)}
.search .sf label{font-size:.76rem;font-weight:650;color:var(--muted);margin-bottom:2px}
.search .sf input,.search .sf select{border:0;background:transparent;padding:2px 0;font-weight:600;font-size:.95rem;width:100%;min-width:0}
.search .sf input:focus,.search .sf select:focus{outline:none}
.search .sf .dt{display:flex;gap:6px}
.search .sf .dt select{width:auto;flex:none;color:var(--ink-2)}
.search .sf .dt input{flex:1;min-width:0}
.search .btn{min-height:auto;border-radius:16px;padding:0 24px}
@media (max-width:1000px){.search{grid-template-columns:1fr 1fr}.search .sf.loc,.search .btn{grid-column:1/-1}.search .btn{min-height:52px}}
@media (max-width:520px){.search{grid-template-columns:1fr}}

/* Category tiles */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cat{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;transition:transform .2s,box-shadow .2s}
.cat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.cat .ci{width:46px;height:46px;border-radius:14px;background:var(--blue-soft);display:grid;place-items:center;color:var(--ink-2)}
.cat b{font-weight:650}
.cat small{color:var(--muted)}

/* Vehicle card */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.vgrid.list{grid-template-columns:1fr}
.vc{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;transition:box-shadow .25s,transform .25s}
.vc:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.vc .ph{position:relative;aspect-ratio:16/10;background:#FFFFFF;display:grid;place-items:center;cursor:pointer;border:0;padding:0;width:100%}
.vc .ph img{width:100%;height:100%;object-fit:contain;padding:14px}
.vc .ph .ph-empty{color:#9BA6B2}
.vc .tl{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}
.vc .fav{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;cursor:pointer;color:#202B36;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.vc .fav[aria-pressed="true"]{color:#B42318}
.vc .fav[aria-pressed="true"] svg{fill:currentColor}
.vc .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.vc h3{font-size:1.08rem}
.vc h3 button{all:unset;cursor:pointer}
.vc h3 button:focus-visible{outline:3px solid var(--gold);border-radius:6px}
.spec{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:.86rem;margin:0;padding:0;list-style:none}
.spec li{display:flex;align-items:center;gap:5px}
.vc .pr{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px}
.vc .pr b{font-size:1.25rem;font-weight:700;letter-spacing:-.02em}
.vc .pr small{display:block;color:var(--muted);font-size:.8rem}
.vc .cmp{display:flex;align-items:center;gap:7px;font-size:.84rem;color:var(--muted);cursor:pointer}
.vc .cmp input{width:17px;height:17px;accent-color:var(--ink)}
.vgrid.list .vc{flex-direction:row}
.vgrid.list .vc .ph{width:260px;flex:none;aspect-ratio:auto;min-height:170px}
@media (max-width:640px){.vgrid.list .vc{flex-direction:column}.vgrid.list .vc .ph{width:100%;aspect-ratio:16/10}}

/* Catalog layout */
.cat-layout{display:grid;grid-template-columns:290px 1fr;gap:28px;align-items:start}
.filters{position:sticky;top:96px;display:grid;gap:20px;padding:20px}
.filters h4,[data-filters] h4{font-size:.86rem;font-weight:650;margin-bottom:10px}
.filters .opt,[data-filters] .opt{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;font-size:.93rem}
.filters .opt input,[data-filters] .opt input{width:18px;height:18px;accent-color:var(--ink)}
.filters input[type=range],[data-filters] input[type=range]{width:100%;accent-color:var(--ink)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar .q{flex:1;min-width:220px;position:relative}
.toolbar .q svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.toolbar .q input{padding-left:44px}
.only-m{display:none}
@media (max-width:960px){.cat-layout{grid-template-columns:1fr}.filters-side{display:none}.only-m{display:inline-flex}}
.resinfo{font-size:.92rem;color:var(--muted);margin-bottom:14px}
.cmpbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:12px;align-items:center;padding:10px 10px 10px 18px;border-radius:18px;background:var(--navy);color:#fff;box-shadow:var(--shadow-lg);font-weight:600;font-size:.92rem}
.cmpbar .btn{min-height:40px}
@media (max-width:860px){.cmpbar{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}

/* Detail */
.crumb{font-size:.88rem;color:var(--muted);margin:22px 0 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb a{text-decoration:none}
.crumb a:hover{text-decoration:underline}
.detail{display:grid;grid-template-columns:1.25fr .85fr;gap:28px;align-items:start}
.gallery{background:#fff;border-radius:28px;aspect-ratio:16/10;display:grid;place-items:center;border:1px solid var(--line)}
.gallery img{width:100%;height:100%;object-fit:contain;padding:28px}
.dside{position:sticky;top:96px;display:grid;gap:16px}
.pkg-price{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.pkg-price:last-of-type{border-bottom:0}
.pkg-price b{font-size:1.15rem}
.specs-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.specs-grid div{padding:16px;border-radius:16px;background:var(--surface-2)}
.specs-grid small{display:block;color:var(--muted);font-size:.8rem}
.specs-grid b{font-size:1.02rem}
@media (max-width:960px){.detail{grid-template-columns:1fr}.dside{position:static}.specs-grid{grid-template-columns:repeat(2,1fr)}}
.costs{width:100%;border-collapse:collapse;font-size:.94rem}
.costs td{padding:11px 0;border-bottom:1px solid var(--line);vertical-align:top}
.costs td:last-child{text-align:right;font-weight:600;white-space:nowrap;padding-left:12px}
.sticky-cta{display:none}
@media (max-width:960px){.sticky-cta{display:flex;position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:35;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line);align-items:center;gap:12px}.sticky-cta b{font-size:1.1rem}.sticky-cta .btn{margin-left:auto}}
.stars{display:inline-flex;gap:2px;color:var(--gold)}

/* Calendar */
.cal{border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--surface)}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-h b{font-size:1rem}
.cal-h button{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.cal-h button:disabled{opacity:.35;cursor:not-allowed}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dw{text-align:center;font-size:.74rem;color:var(--muted);font-weight:600;padding:4px 0}
.day{aspect-ratio:1;border:0;background:transparent;border-radius:12px;font-weight:600;font-size:.92rem;cursor:pointer;position:relative;color:var(--ink);min-height:38px}
.day:hover:not(:disabled){background:var(--surface-2)}
.day:disabled{color:var(--muted);opacity:.45;cursor:not-allowed}
.day.busy{opacity:1;color:var(--error);background:var(--error-bg);text-decoration:line-through}
.day.in{background:var(--blue-soft);border-radius:0}
.day.s,.day.e{background:var(--primary);color:var(--on-primary);border-radius:12px}
.day.td::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px}
.cal-read .day{cursor:default}

/* Booking */
.progress{display:flex;gap:6px;margin:22px 0 24px;overflow-x:auto;padding-bottom:4px}
.progress div{flex:1;min-width:92px}
.progress div::before{content:"";display:block;height:5px;border-radius:3px;background:var(--line);margin-bottom:8px}
.progress div.done::before,.progress div.on::before{background:var(--ink)}
.progress span{font-size:.8rem;font-weight:600;color:var(--muted);display:block}
.progress div.on span{color:var(--ink)}
.progress small{display:block;font-size:.72rem;color:var(--muted)}
.book{display:grid;grid-template-columns:1fr 380px;gap:28px;align-items:start}
.book-sum{position:sticky;top:96px}
.book>div{min-width:0}
.tsel{flex:none !important;width:92px !important;padding-left:10px !important;padding-right:6px !important}
@media (max-width:960px){.book{grid-template-columns:1fr}.book-sum{position:static}}
.sum-veh{display:flex;gap:14px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.sum-veh .thumb{width:96px;height:64px;border-radius:12px;background:#fff;border:1px solid var(--line);flex:none;display:grid;place-items:center;overflow:hidden}
.sum-veh .thumb img{width:100%;height:100%;object-fit:contain;padding:4px}
.lines{display:grid;gap:9px;font-size:.93rem}
.lines div{display:flex;justify-content:space-between;gap:12px}
.lines div span:last-child{font-weight:600;white-space:nowrap}
.lines .sub{color:var(--muted);font-size:.85rem}
.lines .disc span:last-child{color:var(--success)}
.lines .tot{border-top:1px solid var(--line);padding-top:12px;margin-top:4px;font-size:1.05rem}
.lines .tot span:last-child{font-size:1.25rem;font-weight:750}
.step-actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
.mbar{display:none}
@media (max-width:960px){
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));align-items:center;gap:12px}
  .mbar small{display:block;color:var(--muted);font-size:.78rem}
  .mbar b{font-size:1.12rem}
  .mbar .btn{margin-left:auto}
  body.booking{padding-bottom:84px}
  body.booking .bnav{display:none}
  .step-actions{display:none}
}
.pay-list{display:grid;gap:10px}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}.vc,.cat,.btn{transition:none}}
.confirm{text-align:center;padding:36px 22px}
.confirm .ok{width:72px;height:72px;border-radius:50%;background:var(--success-bg);color:var(--success);display:grid;place-items:center;margin:0 auto 18px}
.code{font-weight:750;letter-spacing:.06em;font-size:1.3rem}

/* Booking cards (customer) */
.bk{display:grid;grid-template-columns:120px 1fr auto;gap:18px;align-items:center;padding:18px}
.bk .thumb{width:120px;height:80px;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.bk .thumb img{width:100%;height:100%;object-fit:contain;padding:6px}
.bk .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:720px){.bk{grid-template-columns:84px 1fr}.bk .thumb{width:84px;height:58px}.bk .acts{grid-column:1/-1;justify-content:flex-start}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:12px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .count{position:static;min-width:20px}

/* FAQ */
details.faq{border-bottom:1px solid var(--line);padding:4px 0}
details.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:14px;align-items:center;padding:16px 0;font-weight:600;font-size:1.02rem}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary svg{transition:transform .2s;flex:none}
details.faq[open] summary svg{transform:rotate(45deg)}
details.faq p{padding:0 0 18px;color:var(--ink-2);max-width:70ch}

.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.trust div{padding:22px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.trust .ti{width:44px;height:44px;border-radius:14px;background:var(--sand);color:var(--gold-ink);display:grid;place-items:center;margin-bottom:14px}
.trust b{display:block;margin-bottom:4px}
.trust p{color:var(--muted);font-size:.92rem}
@media (max-width:900px){.trust{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.trust{grid-template-columns:1fr}}
.promo{display:flex;gap:18px;align-items:center;padding:22px;border-radius:22px;background:var(--navy);color:#F3EEE3}
.promo .pc{font-weight:750;letter-spacing:.08em;padding:8px 14px;border:1.5px dashed var(--gold);border-radius:12px;color:var(--gold);white-space:nowrap}
.promo small{color:rgba(243,238,227,.7)}
@media (max-width:640px){.promo{flex-direction:column;align-items:flex-start}}

/* Footer + bottom nav */
footer{margin-top:40px;background:var(--surface);border-top:1px solid var(--line);padding:40px 0 calc(40px + env(safe-area-inset-bottom,0px))}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:24px}
.fgrid h4{font-size:.86rem;margin-bottom:12px}
.fgrid a,.fgrid button.fl{display:block;color:var(--muted);text-decoration:none;padding:4px 0;font-size:.92rem;background:none;border:0;cursor:pointer;text-align:left}
.fgrid a:hover,.fgrid button.fl:hover{color:var(--ink)}
@media (max-width:760px){.fgrid{grid-template-columns:1fr 1fr}}
.bnav{display:none}
@media (max-width:860px){
  body{padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;font-size:.72rem;font-weight:600;color:var(--muted);padding:6px 0;min-height:52px;justify-content:center;position:relative}
  .bnav a.on{color:var(--ink)}
  .bnav a.on svg{stroke-width:2.4}
  .bnav .count{top:0;right:calc(50% - 22px)}
}

/* Modal + toast */
dialog.modal{border:0;padding:0;border-radius:24px;width:min(640px,94vw);max-height:90vh;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-lg)}
dialog.modal.wide{width:min(980px,96vw)}
dialog.modal::backdrop{background:rgba(17,23,30,.5);backdrop-filter:blur(3px)}
.mh{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.mh h3{font-size:1.15rem}
.mh .icon-btn{margin-left:auto;width:40px;height:40px}
.mb{padding:22px}
.mf{display:flex;gap:10px;justify-content:flex-end;padding:0 22px 22px;flex-wrap:wrap}
@media (max-width:640px){dialog.modal{width:100vw;max-width:100vw;max-height:92vh;margin:auto 0 0;border-radius:24px 24px 0 0}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);z-index:100;background:var(--ink);color:var(--bg);padding:13px 18px;border-radius:14px;font-weight:550;font-size:.93rem;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:860px){.toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}}

/* Compare table */
.ctable{width:100%;border-collapse:collapse;font-size:.92rem;min-width:520px}
.ctable th,.ctable td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.ctable th{color:var(--muted);font-weight:600;width:150px}
.ctable td img{width:100%;max-width:200px;aspect-ratio:16/10;object-fit:contain;background:#fff;border-radius:12px}
.scroll-x{overflow-x:auto}

/* Business portals */
.biz{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 110px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:68px;height:calc(100vh - 68px);overflow-y:auto}
.side .who{padding:6px 10px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.side .who small{display:block;color:var(--muted);font-size:.78rem}
.side button.si{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;padding:11px 12px;border-radius:12px;font-weight:550;color:var(--ink-2);cursor:pointer;text-align:left;font-size:.93rem}
.side button.si:hover{background:var(--surface-2)}
.side button.si[aria-current="true"]{background:var(--blue-soft);color:var(--ink);font-weight:650}
.bmain{padding:28px;min-width:0}
.bmain h2{font-size:1.6rem;margin-bottom:6px}
.bhead{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.kpi{padding:18px 20px}
.kpi small{display:block;color:var(--muted);font-size:.84rem;font-weight:550}
.kpi b{display:block;font-size:1.55rem;letter-spacing:-.02em;margin-top:4px}
.kpi span{font-size:.8rem;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem;min-width:680px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:.8rem;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl td.wrap{white-space:normal;min-width:220px}
.tbl tr:last-child td{border-bottom:0}
.tbl td .field{min-height:38px;padding:6px 10px;font-size:.9rem}
.tbl .num{text-align:right;white-space:nowrap}
.mthumb{width:64px;height:42px;border-radius:9px;background:#fff;border:1px solid var(--line);object-fit:contain;padding:3px;display:block}
.chart{display:flex;align-items:flex-end;gap:10px;height:200px;padding-top:10px}
.chart .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.chart .bar i{display:block;width:100%;max-width:52px;border-radius:10px 10px 4px 4px;background:var(--ink-2);min-height:3px}
.chart .bar.cur i{background:var(--gold)}
.chart .bar small{font-size:.74rem;color:var(--muted)}
.chart .bar em{font-style:normal;font-size:.72rem;font-weight:650;color:var(--ink-2);white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
.checklist{display:grid;gap:8px}
.checklist label{display:flex;gap:10px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.checklist input{width:18px;height:18px;accent-color:var(--ink)}
.biz-tabs{display:none}
@media (max-width:860px){
  .biz{grid-template-columns:1fr}
  .side{display:none}
  .biz-tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:68px;z-index:20}
  .biz-tabs button{flex:none;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:999px;font-weight:600;font-size:.86rem;cursor:pointer;white-space:nowrap}
  .biz-tabs button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .bmain{padding:20px 16px}
}
.upload{border:1.5px dashed var(--line);border-radius:16px;padding:18px;text-align:center;cursor:pointer;display:grid;place-items:center;gap:8px;min-height:140px;background:var(--surface-2)}
.upload img{max-height:120px;object-fit:contain;background:#fff;border-radius:10px}
.invoice{font-size:.93rem}
.invoice .ih{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.notfound{padding:80px 20px;text-align:center}

[data-filters]{display:grid;gap:20px}
.stack>*,.two>*,.grid2>*,.grid3>*{min-width:0}

/* ===================== MODE APLIKASI (HP) ===================== */
html.app .demo{font-size:.72rem;padding:5px 12px}
html.app .wrap{padding:0 16px}
html.app .top{background:var(--bg);border-bottom-color:transparent}
html.app .top .wrap{height:62px}
.atop{display:flex;align-items:center;gap:8px;width:100%}
.atop .icon-btn{width:42px;height:42px;border-radius:14px;flex:none}
.atop .tt{font-weight:700;font-size:1.08rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.atop .greet small{display:block;color:var(--muted);font-size:.8rem}
.atop .greet b{font-size:1.2rem;letter-spacing:-.02em;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html.app #foot{display:none}
html.app .crumb{display:none}

html.app #bkWrap>h2{display:none}
html.app #bkWrap .progress{margin-top:6px}

.app-home{padding:4px 0 28px;display:grid;gap:24px}
.app-home>*{min-width:0}
.ah-search{padding:18px;border-radius:26px}
.ah-q{font-weight:700;font-size:1.3rem;margin-bottom:14px;letter-spacing:-.025em}
.ah-lok{display:flex;width:100%;margin-bottom:10px}
.ah-lok button{flex:1;justify-content:center;min-height:42px}
.ah-dates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.ah-d{display:flex;flex-direction:column;gap:2px;padding:11px 12px;border-radius:16px;background:var(--surface-2);min-width:0;cursor:pointer}
.ah-d span{font-size:.74rem;font-weight:650;color:var(--muted)}
.ah-d input,.ah-d select{border:0;background:transparent;font-weight:650;font-size:.9rem;padding:2px 0;min-width:0;width:100%}
.ah-d select{color:var(--ink-2);font-weight:550}
.ah-d input:focus,.ah-d select:focus{outline:none}
.svc4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px}
.svc4 button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.76rem;font-weight:600;color:var(--ink);cursor:pointer;padding:0;text-align:center;line-height:1.25}
.svc4 .si4{width:58px;height:58px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);box-shadow:var(--shadow);transition:transform .15s}
.svc4 button:active .si4{transform:scale(.94)}
.ahh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ahh h3{font-size:1.12rem}
.ahh a{font-size:.88rem;font-weight:600;color:var(--gold-ink);text-decoration:none}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:min(70%,250px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 10px;scrollbar-width:none;overscroll-behavior-x:contain}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start}
.mc{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:10px 10px 14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.mc .mp{aspect-ratio:16/10;background:#fff;border-radius:16px;display:grid;place-items:center;margin-bottom:8px;overflow:hidden}
.mc .mp img{width:100%;height:100%;object-fit:contain;padding:8px}
.mc small{color:var(--muted);padding:0 4px;font-size:.78rem}
.mc b{font-size:1rem;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc span{font-weight:700;padding:6px 4px 0}
.mc span em{font-style:normal;font-weight:500;color:var(--muted);font-size:.78rem}
.hscroll .promo{flex-direction:column;align-items:flex-start;gap:8px;padding:18px;border-radius:22px}
.hscroll .promo b{font-size:1rem;line-height:1.3}
.ah-active{display:flex;gap:12px;align-items:center;padding:14px;border-radius:22px;background:var(--navy);color:#F3EEE3;text-decoration:none}
.ah-active .thumb{width:76px;height:50px;border-radius:12px;background:#fff;flex:none;overflow:hidden;display:grid;place-items:center}
.ah-active .thumb img{width:100%;height:100%;object-fit:contain;padding:4px}
.ah-active small{color:rgba(243,238,227,.72);display:block;font-size:.8rem}
.ah-active b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-list{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.menu-list a{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:550;min-height:56px}
.menu-list a:last-child{border-bottom:0}
.menu-list a svg:last-child{margin-left:auto;color:var(--muted)}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 4px;margin:0 -16px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chiprow .chip{flex:none}
html.app .toolbar .q{min-width:0;flex-basis:100%}
html.app .toolbar #sortSel{flex:1}
/* Kartu hasil pencarian versi aplikasi: foto di kiri */
html.app #results .vgrid{grid-template-columns:1fr;gap:12px}
html.app #results .vc{flex-direction:row;border-radius:22px}
html.app #results .vc .ph{width:132px;flex:none;aspect-ratio:auto;min-height:150px}
html.app #results .vc .ph img{padding:8px}

html.app #results .vc .tl{top:8px;left:8px}

/* Detail versi aplikasi: foto penuh selebar layar */

html.app .tabs{margin-bottom:16px}

/* ===================== TEMA GOLD · BIRU LANGIT · TOSCA (gaya gradasi Instagram) ===================== */
:root{
  --gold-c:#F2B23A; --tosca-c:#14B8A6; --sky-c:#2FA8F2;
  --ig:linear-gradient(45deg,#F6BE45 0%,#F0A532 18%,#16C0AE 56%,#2FA8F2 100%);
  --ig-soft:linear-gradient(135deg,#FFF5DD 0%,#E3F8F5 50%,#E2F2FD 100%);
  --ig-btn:linear-gradient(135deg,#0E9E90 0%,#1690D6 100%);
  --ig-gold:linear-gradient(135deg,#F7C95A 0%,#EBA12C 100%);
  --bg:#F5FAFB; --surface:#FFFFFF; --surface-2:#EDF6F7; --sand:#FFF1D2; --blue-soft:#E1F3FB;
  --ink:#0F2F38; --ink-2:#28505B; --muted:#56737C; --line:#D8E9ED;
  --navy:#0E3540; --slate:#28505B; --gold:#F0A532; --gold-ink:#93640B; --sage:#14B8A6;
  --primary:#0E8F84; --on-primary:#FFFFFF; --hero-bg:#F5FAFB;
  --shadow:0 1px 2px rgba(15,47,56,.05), 0 10px 28px -16px rgba(14,110,130,.28);
  --shadow-lg:0 24px 60px -28px rgba(14,110,130,.42);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08191F; --surface:#0F252D; --surface-2:#153039; --sand:#33280F; --blue-soft:#12303D;
    --ink:#E6F4F6; --ink-2:#B9D6DC; --muted:#8AAAB2; --line:#1F3F49;
    --navy:#0A2B33; --gold:#F5B848; --gold-ink:#F5C565; --primary:#2CC6B4; --on-primary:#062A27; --hero-bg:#08191F;
    --ig-soft:linear-gradient(135deg,#2A2414 0%,#0F2E2D 50%,#0E2738 100%);
  }
}
:root[data-theme="dark"]{
  --bg:#08191F; --surface:#0F252D; --surface-2:#153039; --sand:#33280F; --blue-soft:#12303D;
  --ink:#E6F4F6; --ink-2:#B9D6DC; --muted:#8AAAB2; --line:#1F3F49;
  --navy:#0A2B33; --gold:#F5B848; --gold-ink:#F5C565; --primary:#2CC6B4; --on-primary:#062A27; --hero-bg:#08191F;
  --ig-soft:linear-gradient(135deg,#2A2414 0%,#0F2E2D 50%,#0E2738 100%);
}
/* Merek & tombol */
.brand-mark{background:var(--ig) !important;color:#fff !important;box-shadow:0 6px 16px -8px rgba(22,160,190,.7)}
.btn-primary{background:var(--ig-btn);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.12)}
.btn-primary:hover{box-shadow:0 10px 24px -10px rgba(22,144,214,.65)}
.btn-gold{background:var(--ig-gold);color:#3A2706}
.link{text-decoration-color:var(--tosca-c)}
:focus-visible{outline-color:var(--sky-c)}
.demo{background:var(--ig-soft);color:var(--ink)}
.eyebrow{color:var(--gold-ink)}
/* Hero */
.hero{background:var(--ig-soft)}
.hero h1 span{background:var(--ig);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-img::before{background:var(--ig);opacity:.28;filter:blur(2px)}
.search .btn{background:var(--ig-btn)}
/* Cincin ala story Instagram untuk ikon kategori & layanan */
.cat .ci,.svc4 .si4{background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--ig) border-box;border:2.5px solid transparent;color:var(--ink-2)}
.cat .ci{border-radius:50%;width:52px;height:52px}
.svc4 .si4{border-radius:50%}
.cat:hover .ci,.svc4 button:hover .si4{color:var(--primary)}
.trust .ti{background:var(--ig);color:#fff}
/* Chip, segmen, tab */
.chip[aria-pressed="true"]{background:var(--ig-btn);color:#fff;border-color:transparent}
.tabs button[aria-selected="true"]{border-bottom-color:transparent;border-image:var(--ig) 1;border-bottom-width:3px;border-bottom-style:solid}
.biz-tabs button[aria-current="true"]{background:var(--ig-btn);color:#fff;border-color:transparent}
.side button.si[aria-current="true"]{background:var(--ig-soft);box-shadow:inset 3px 0 0 var(--tosca-c)}
.choice:has(input:checked){border-color:var(--primary);background:var(--blue-soft)}
.choice input,.filters .opt input,[data-filters] .opt input,.checklist input,[data-filters] input[type=range]{accent-color:var(--primary)}
/* Lencana */
.badge.gold{background:var(--ig-gold);color:#3A2706}
.badge.info{background:var(--blue-soft);color:#0B6FA8}
.count{background:var(--ig);color:#fff}
/* Kartu & harga */
.vc:hover{border-color:rgba(22,184,166,.45)}
.vc .pr b,.mc span{background:linear-gradient(90deg,#0E8F84,#1690D6);-webkit-background-clip:text;background-clip:text;color:transparent}
.mc span em{-webkit-text-fill-color:var(--muted)}
.vc .fav[aria-pressed="true"]{color:#E1306C}
/* Blok gelap jadi gradasi */
.promo,.ah-active,.app-prof{background:var(--ig);color:#fff}
.promo small,.ah-active small,.app-prof small{color:rgba(255,255,255,.88)}
.promo .pc{border-color:#fff;color:#fff;background:rgba(255,255,255,.12)}
.app-prof .av{background:#fff;color:var(--primary);box-shadow:0 0 0 3px rgba(255,255,255,.45)}
.cmpbar{background:linear-gradient(135deg,#0E3540,#0E5A6A)}
/* Kalender & progres */
.day.s,.day.e{background:var(--ig-btn);color:#fff}
.day.in{background:var(--blue-soft)}
.progress div.done::before,.progress div.on::before{background:var(--ig)}
.chart .bar i{background:linear-gradient(180deg,#2FA8F2,#14B8A6)}
.chart .bar.cur i{background:var(--ig-gold)}
/* Navigasi bawah */
.bnav a.on{color:var(--primary)}
.bnav a.on::after{content:"";position:absolute;bottom:2px;left:50%;width:22px;height:3px;margin-left:-11px;border-radius:3px;background:var(--ig)}
.toast{background:linear-gradient(135deg,#0E3540,#0E5A6A);color:#fff}
.confirm .ok{background:var(--ig);color:#fff}
.empty .ei{background:var(--ig-soft);color:var(--primary)}
.upload{background:var(--ig-soft)}

/* ===================== PENYESUAIAN: GOLDLY · BIRU LANGIT · TOSCATIC ===================== */
/* Biru langit & tosca dominan, emas hanya kilau lembut (sampanye) */
:root{
  --ig:linear-gradient(45deg,#F1DDA0 0%,#8EDFCF 20%,#18BDB0 46%,#22A9E6 76%,#58C8F7 100%);
  --ig-card:radial-gradient(110% 90% at 0% 0%,rgba(244,226,170,.62) 0%,rgba(244,226,170,0) 46%),linear-gradient(125deg,#0FA799 0%,#14A9C2 45%,#1E9DE0 80%,#4DBFF5 100%);
  --ig-btn:linear-gradient(135deg,#10A698 0%,#1C9CDD 100%);
  --ig-gold:linear-gradient(135deg,#FBF1D3 0%,#EED9A2 100%);
  --ig-soft:linear-gradient(135deg,#FBF6E5 0%,#E2F8F4 42%,#E1F2FD 100%);
  --gold:#D8B867; --gold-ink:#0B7F75;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--gold-ink:#5FDCCB;--ig-soft:linear-gradient(135deg,#1F2116 0%,#0D2C2C 45%,#0D2638 100%)}}
:root[data-theme="dark"]{--gold-ink:#5FDCCB;--ig-soft:linear-gradient(135deg,#1F2116 0%,#0D2C2C 45%,#0D2638 100%)}
.brand-mark{background:var(--ig-card) !important}
.promo,.ah-active,.app-prof,.trust .ti,.confirm .ok{background:var(--ig-card)}
.count{background:var(--ig-btn)}
.btn-gold{background:var(--ig-gold);color:#4A3A12}
.badge.gold{background:var(--ig-gold);color:#5A4612}
.chart .bar.cur i{background:var(--ig-btn)}
.hero h1 span{background:linear-gradient(90deg,#C9A04A 0%,#18B3A3 38%,#1C9CDD 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.vc .pr b,.mc span{background:linear-gradient(90deg,#0E9A8C,#1C9CDD)}
.promo .pc{border-color:rgba(255,255,255,.9)}
/* Kilau emas lembut pada elemen bergradasi */
.btn-primary,.brand-mark,.promo,.ah-active,.app-prof{box-shadow:0 10px 26px -14px rgba(28,156,221,.55),0 0 0 1px rgba(241,221,160,.25) inset}
/* Gambar mobil besar */
.hero-img::before{background:var(--ig);opacity:.22;filter:blur(6px)}
.hero-img img{mix-blend-mode:normal;border-radius:28px}
.ah-hero{position:relative;display:block;border-radius:26px;overflow:hidden;background:var(--ig-soft);text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.ah-hero::before{content:"";position:absolute;inset:auto -10% -38% 30%;height:85%;border-radius:50%;background:var(--ig);opacity:.35;filter:blur(18px)}
.ah-hero img{position:relative;display:block;width:100%;aspect-ratio:16/9;object-fit:contain;padding:12px 10px 4px}
.ah-hero .cap{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:0 16px 14px}
.ah-hero .cap small{display:block;color:var(--muted);font-size:.78rem;font-weight:600}
.ah-hero .cap b{font-size:1.12rem;letter-spacing:-.02em}
.ah-hero .cap span{font-weight:700;white-space:nowrap;background:linear-gradient(90deg,#0E9A8C,#1C9CDD);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ===================== ULTIMATE PRESTIGE ===================== */
:root{
  --mid:#061C24; --deep:#0A2C38; --champ:#D9C08A; --champ-ink:#7F6738;
  --serif:"Cormorant Garamond", "Times New Roman", Georgia, serif;
  --stage:radial-gradient(55% 70% at 78% 42%,rgba(59,183,245,.24),transparent 70%),radial-gradient(45% 60% at 12% 0%,rgba(217,192,138,.2),transparent 62%),radial-gradient(40% 50% at 40% 100%,rgba(25,195,177,.18),transparent 70%),linear-gradient(160deg,#061C24 0%,#0A2C38 55%,#0B3446 100%);
  --bg:#F4F7F7; --line:#DCE6E8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#061419;--champ-ink:#D9C08A;--line:#1C3943}}
:root[data-theme="dark"]{--bg:#061419;--champ-ink:#D9C08A;--line:#1C3943}
/* Tipografi berkelas */
h1,h2,.pinfo h3,.ah-cap b{font-family:var(--serif);font-weight:600;letter-spacing:-.005em}
h1{font-size:clamp(2.8rem,6.4vw,5rem);line-height:1}
h2{font-size:clamp(2rem,3.8vw,2.9rem);line-height:1.05}
.bmain h2{font-size:2rem}
.eyebrow{color:var(--champ-ink);letter-spacing:.2em;text-transform:uppercase;font-size:.7rem;font-weight:700}
/* Header & banner gelap */
body::before{background:var(--mid)}
.demo{background:#04141A;color:rgba(234,244,246,.72)}
.demo b{color:var(--champ)}
.top,html.app .top{background:rgba(6,28,36,.94);border-bottom:1px solid rgba(217,192,138,.2);color:#EAF4F6}
.top .brand{color:#fff;letter-spacing:.2em}
.nav a{color:rgba(234,244,246,.7)}
.nav a:hover,.nav a.on{background:rgba(255,255,255,.08);color:#fff}
.top .icon-btn{background:transparent;border-color:rgba(255,255,255,.16);color:#EAF4F6}
.top .icon-btn:hover{background:rgba(255,255,255,.08)}
.top .btn-secondary{background:transparent;color:#fff;border-color:rgba(255,255,255,.22)}
.atop .greet small{color:rgba(234,244,246,.62)}
.atop .greet b,.atop .tt{color:#fff}
/* Hero panggung gelap */
.hero{background:var(--stage);color:#EAF4F6;padding:76px 0 44px}
.hero h1{color:#fff}
.hero .lead{color:rgba(234,244,246,.76)}
.hero .eyebrow{color:var(--champ)}
.hero h1 span{background:linear-gradient(90deg,#EAD6A6 0%,#5FDCCB 48%,#4CC0F7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic}
.hero-img{aspect-ratio:16/10.5}
.hero-img::before{inset:auto 6% -5% 6%;height:30%;border-radius:50%;background:radial-gradient(closest-side,rgba(59,183,245,.55),transparent);filter:blur(14px);opacity:1}
.hero-img img{background:linear-gradient(180deg,#FFFFFF 0%,#E8F2F5 100%);border-radius:32px;padding:18px;border:1px solid rgba(217,192,138,.45);box-shadow:0 40px 80px -40px rgba(0,0,0,.7)}
.search{border:1px solid rgba(217,192,138,.4);box-shadow:0 34px 70px -34px rgba(0,0,0,.65)}
.hero .ferr{color:#FFB4A8}
.hstats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:30px;border-top:1px solid rgba(217,192,138,.22)}
.hstats div{padding:20px 18px 0 0}
.hstats b{display:block;font-family:var(--serif);font-size:2rem;font-weight:600;color:#fff;line-height:1.1}
.hstats span{color:rgba(234,244,246,.62);font-size:.86rem}
@media (max-width:860px){.hstats{grid-template-columns:1fr 1fr;row-gap:6px}}
/* Bagian beranda: judul di tengah dengan garis sampanye */
.sec{padding:76px 0}
.home .sec-head{flex-direction:column;align-items:center;text-align:center;margin-bottom:34px}
.home .sec-head p{margin-left:auto;margin-right:auto}
.home .sec-head h2::after{content:"";display:block;width:56px;height:1px;background:var(--champ);margin:18px auto 0}
.home .two .card.pad{border-radius:28px;padding:32px}
/* Pita koleksi prestise */
.prestige{background:var(--stage);color:#EAF4F6;padding:88px 0;margin:24px 0}
.ph-head{text-align:center;margin-bottom:40px}
.ph-head .eyebrow{color:var(--champ)}
.ph-head h2{color:#fff;margin-top:10px}
.ph-head h2::after{content:"";display:block;width:56px;height:1px;background:var(--champ);margin:18px auto 0}
.ph-head .d{color:rgba(234,244,246,.7);max-width:54ch;margin:16px auto 0}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.pcard{display:flex;flex-direction:column;border-radius:28px;overflow:hidden;background:rgba(255,255,255,.045);border:1px solid rgba(217,192,138,.24);text-decoration:none;color:#EAF4F6;transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .35s}
.pcard:hover{transform:translateY(-4px);border-color:rgba(217,192,138,.6)}
.pimg{background:linear-gradient(180deg,#FFFFFF 0%,#E8F2F5 100%);aspect-ratio:16/10;display:grid;place-items:center}
.pimg img{width:100%;height:100%;object-fit:contain;padding:16px}
.pinfo{padding:22px 24px 24px;display:grid;gap:6px;align-content:start}
.pinfo small{color:var(--champ);letter-spacing:.18em;text-transform:uppercase;font-size:.68rem;font-weight:700}
.pinfo h3{font-size:1.75rem;color:#fff;line-height:1.1}
.pinfo p{color:rgba(234,244,246,.62);font-size:.9rem}
.pprice{display:flex;align-items:baseline;gap:6px;margin-top:8px;flex-wrap:wrap}
.pprice b{font-family:var(--serif);font-size:1.7rem;font-weight:600;color:#fff}
.pprice span,.pprice em{color:rgba(234,244,246,.58);font-size:.82rem;font-style:normal}
.plink{display:inline-flex;align-items:center;gap:6px;color:#5FDCCB;font-weight:600;font-size:.9rem;margin-top:8px}
.pcard.big{grid-column:1/-1;flex-direction:row}
.pcard.big .pimg{flex:1.35;aspect-ratio:auto;min-height:360px}
.pcard.big .pinfo{flex:1;align-content:center;padding:44px}
.pcard.big h3{font-size:2.8rem}
@media (max-width:900px){.pgrid{grid-template-columns:1fr}.pcard.big{flex-direction:column}.pcard.big .pimg{min-height:220px}.pcard.big .pinfo{padding:24px}.pcard.big h3{font-size:2rem}}
.hscroll .pcard{background:var(--mid)}
/* Kartu & elemen lebih halus */
.vc,.cat,.trust div,.card{border-radius:24px}
.vc:hover,.cat:hover{border-color:rgba(217,192,138,.65)}
.trust div{padding:30px}
.trust .ti{border-radius:50%}
.promo{border-radius:28px;padding:26px}
.gallery{border-radius:32px;background:linear-gradient(180deg,#FFFFFF 0%,#E8F2F5 100%)}
.dside .card{border:1px solid rgba(217,192,138,.4)}
/* Footer gelap */
footer{background:var(--mid);color:rgba(234,244,246,.7);border-top:1px solid rgba(217,192,138,.22)}
footer .brand{color:#fff;letter-spacing:.2em}
.fgrid h4{color:var(--champ);letter-spacing:.16em;text-transform:uppercase;font-size:.7rem}
.fgrid a,.fgrid button.fl{color:rgba(234,244,246,.68)}
.fgrid a:hover{color:#fff}
footer .muted{color:rgba(234,244,246,.52) !important}
/* Navigasi bawah gelap (aplikasi) */
html.app .bnav,.bnav{background:var(--mid);border-top:1px solid rgba(217,192,138,.18)}
.bnav a{color:rgba(234,244,246,.55)}
.bnav a.on{color:#5FDCCB}
/* Panggung beranda aplikasi */
.ah-stage{margin:-4px -16px 0;padding:8px 18px 64px;background:var(--stage);color:#fff;border-radius:0 0 36px 36px}
.ah-stage .eyebrow{color:var(--champ);margin-bottom:12px}
.ah-show{display:block;border-radius:26px;overflow:hidden;background:linear-gradient(180deg,#FFFFFF 0%,#E8F2F5 100%);border:1px solid rgba(217,192,138,.45);box-shadow:0 30px 60px -30px rgba(0,0,0,.75)}
.ah-show img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;padding:10px}
.ah-cap{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:14px}
.ah-cap b{display:block;font-size:1.65rem;color:#fff;line-height:1.1}
.ah-cap small{color:rgba(234,244,246,.65);font-size:.82rem}
.ah-cap span{font-family:var(--serif);font-size:1.35rem;font-weight:600;white-space:nowrap;color:#EAD6A6}
.ah-cap span em{font-family:var(--font);font-style:normal;font-size:.76rem;color:rgba(234,244,246,.6);margin-left:3px}
html.app .app-home .ah-search{margin-top:-58px;position:relative;z-index:2;border:1px solid rgba(217,192,138,.35);box-shadow:0 26px 50px -28px rgba(6,28,36,.55)}
html.app .app-home{padding-top:0}
.ah-q{font-family:var(--serif);font-size:1.6rem;font-weight:600}
.search{color:var(--ink)}
footer .brand{display:inline-flex}

/* ===================== FOTO & TEKS BERGRADASI LANGSUNG ===================== */
/* Perbaikan: harga kembali menjadi teks bergradasi (bukan balok warna) */
.vc .pr b,.mc span{background:linear-gradient(90deg,#0E9A8C 0%,#1C9CDD 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.mc span em{-webkit-text-fill-color:var(--muted)}
/* Panggung foto: latar putih foto melebur ke gradasi tosca–biru langit dengan kilau sampanye */
.vc .ph,.mc .mp,.gallery,.pimg,.sum-veh .thumb,.bk .thumb,.ah-active .thumb{
  background:radial-gradient(60% 55% at 50% 78%,rgba(59,183,245,.28) 0%,rgba(59,183,245,0) 70%),radial-gradient(45% 45% at 12% 8%,rgba(233,214,166,.55) 0%,rgba(233,214,166,0) 70%),linear-gradient(180deg,#F1FAF9 0%,#E3F3F6 62%,#D5ECF2 100%)}
.vc .ph img,.mc .mp img,.gallery img,.pimg img,.sum-veh .thumb img,.bk .thumb img,.ah-active .thumb img,.mthumb{mix-blend-mode:multiply}
.mthumb{background:linear-gradient(180deg,#F1FAF9,#DDF0F4)}
/* Foto menyatu ke badan kartu */
.vc .ph::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,var(--surface) 100%);pointer-events:none}
.vc .bd{position:relative;margin-top:-18px;background:linear-gradient(180deg,var(--surface) 0%,var(--surface) 55%,rgba(225,243,251,.55) 100%);border-radius:0 0 24px 24px}
/* Nama kendaraan bergradasi biru malam → tosca → biru langit */
.vc h3 button,.mc b,.detail h1,.sum-veh b{background:linear-gradient(90deg,#0E3540 0%,#0E8F84 55%,#1C9CDD 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.vc h3 button{display:inline}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .vc h3 button,:root:not([data-theme="light"]) .mc b,:root:not([data-theme="light"]) .detail h1,:root:not([data-theme="light"]) .sum-veh b{background-image:linear-gradient(90deg,#EAF4F6 0%,#5FDCCB 55%,#4CC0F7 100%)}
  :root:not([data-theme="light"]) .vc .pr b,:root:not([data-theme="light"]) .mc span{background-image:linear-gradient(90deg,#5FDCCB,#4CC0F7)}
  :root:not([data-theme="light"]) .vc .ph::after{height:22%}
  :root:not([data-theme="light"]) .vc .bd{background:linear-gradient(180deg,var(--surface) 0%,var(--surface) 55%,rgba(18,48,61,.9) 100%)}}
:root[data-theme="dark"] .vc h3 button,:root[data-theme="dark"] .mc b,:root[data-theme="dark"] .detail h1,:root[data-theme="dark"] .sum-veh b{background-image:linear-gradient(90deg,#EAF4F6 0%,#5FDCCB 55%,#4CC0F7 100%)}
:root[data-theme="dark"] .vc .pr b,:root[data-theme="dark"] .mc span{background-image:linear-gradient(90deg,#5FDCCB,#4CC0F7)}
/* Mode aplikasi: kartu horizontal, gradasi foto melebur ke kanan */
html.app #results .vc .ph::after{left:auto;top:0;bottom:0;width:30%;height:auto;background:linear-gradient(90deg,rgba(255,255,255,0),var(--surface))}
html.app #results .vc .bd{margin-top:0;border-radius:0 22px 22px 0}

/* ===================== FOTO MELUAS + TEKS TRANSPARAN DI ATASNYA ===================== */
/* Batalkan gradasi teks & panel foto sebelumnya */
.vc h3 button,.mc b,.detail h1,.sum-veh b,.vc .pr b,.mc span{background:none !important;-webkit-text-fill-color:currentColor !important;color:inherit}
.vc .pr b{color:var(--ink)}
.vc .ph::after{display:none !important}
.vc .ph,.mc .mp,.pimg{background:transparent !important}
/* Kartu: foto meluas memenuhi kartu, teks menumpang tanpa panel */
.vc,.mc,.pcard{position:relative;overflow:hidden;isolation:isolate}
.vc{background:#EEF4F5;border-color:rgba(255,255,255,.55)}
.mc{background:#EEF4F5}
.vbg{position:absolute;left:-15%;top:-15%;width:130%;height:130%;object-fit:cover;filter:blur(30px) saturate(1.45) brightness(1.02);z-index:-2;pointer-events:none}
.vc::before,.mc::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.12) 45%,rgba(255,255,255,.42) 100%)}
.vc .bd{background:transparent !important;margin-top:0 !important}
.vc .ph img,.mc .mp img{mix-blend-mode:multiply;-webkit-box-reflect:below -4px linear-gradient(transparent 60%,rgba(0,0,0,.26))}
.vc .ph{overflow:visible}
.vc .bd{padding-top:22px}
.vc .spec,.vc .pr small,.vc .cmp{color:var(--ink-2)}
.vc .fav{background:rgba(255,255,255,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.vc .tl .badge{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mc{border-color:rgba(255,255,255,.55)}
.mc .mp{margin-bottom:22px}
/* Koleksi prestise: foto meluas ke area teks dengan selubung gelap transparan */
.pcard{background:#0A2C38}
.pcard .vbg{filter:blur(34px) saturate(1.4)}
.pcard::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(6,28,36,0) 0%,rgba(6,28,36,.25) 42%,rgba(6,28,36,.78) 100%)}
.pcard.big::before{background:linear-gradient(90deg,rgba(6,28,36,0) 0%,rgba(6,28,36,.3) 45%,rgba(6,28,36,.82) 100%)}
.pimg img{mix-blend-mode:multiply;-webkit-box-reflect:below -4px linear-gradient(transparent 62%,rgba(0,0,0,.22))}
.pcard .pinfo{position:relative}
.pinfo h3,.pprice b{text-shadow:0 2px 14px rgba(6,28,36,.45)}
@media (max-width:900px){.pcard.big::before{background:linear-gradient(180deg,rgba(6,28,36,0) 0%,rgba(6,28,36,.3) 45%,rgba(6,28,36,.8) 100%)}}
/* Mode gelap: selubung gelap transparan, teks terang */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .vc::before,:root:not([data-theme="light"]) .mc::before{background:linear-gradient(180deg,rgba(6,20,25,0) 0%,rgba(6,20,25,.4) 48%,rgba(6,20,25,.78) 100%)}
  :root:not([data-theme="light"]) .vc .pr b{color:#fff}
  :root:not([data-theme="light"]) .vc .spec,:root:not([data-theme="light"]) .vc .pr small,:root:not([data-theme="light"]) .vc .cmp{color:#D7E7EA}}
:root[data-theme="dark"] .vc::before,:root[data-theme="dark"] .mc::before{background:linear-gradient(180deg,rgba(6,20,25,0) 0%,rgba(6,20,25,.4) 48%,rgba(6,20,25,.78) 100%)}
:root[data-theme="dark"] .vc .pr b{color:#fff}
/* Aplikasi (kartu horizontal): foto meluas ke kanan, tanpa pantulan */
html.app #results .vc .ph img{-webkit-box-reflect:none}
html.app #results .vc::before{background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.1) 35%,rgba(255,255,255,.4) 100%)}
html.app #results .vc .bd{padding-top:12px}

/* ===================== PERPANJANGAN FOTO REALISTIS (menggantikan versi buram) ===================== */
.vbg{display:none !important}
.vc::before,.mc::before,.pcard::before,.pcard.big::before{display:none !important}
.vc,.mc,.pcard{background:linear-gradient(180deg,var(--et,#F3F6F7) 0%,var(--eb,#EEF2F3) 46%,var(--eb,#EEF2F3) 70%,color-mix(in srgb,var(--eb,#EEF2F3) 90%,#0E3540) 100%) !important;border-color:color-mix(in srgb,var(--eb,#EEF2F3) 80%,#0E3540)}
.gallery{background:linear-gradient(180deg,var(--et,#F3F6F7) 0%,var(--eb,#EEF2F3) 100%) !important}
.pcard.big{background:linear-gradient(90deg,var(--et,#F3F6F7) 0%,var(--eb,#EEF2F3) 55%,color-mix(in srgb,var(--eb,#EEF2F3) 92%,#0E3540) 100%) !important}
/* Tepi foto dilunakkan agar menyatu dengan perpanjangannya */
.vc .ph img,.mc .mp img,.pimg img,.gallery img{mix-blend-mode:normal;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 5%,#000 95%,transparent 100%),linear-gradient(180deg,transparent 0,#000 5%,#000 94%,transparent 100%);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent 0,#000 5%,#000 95%,transparent 100%),linear-gradient(180deg,transparent 0,#000 5%,#000 94%,transparent 100%);mask-composite:intersect}
/* Pantulan di "lantai" foto, teks menumpang di area perpanjangan */
.vc .ph img,.mc .mp img,.pimg img{-webkit-box-reflect:below 0 linear-gradient(transparent 64%,rgba(0,0,0,.2))}
.vc .bd,.pinfo{background:transparent !important}
.vc h3 button,.vc .pr b{color:#0F2F38}
.vc .spec,.vc .pr small,.vc .cmp{color:#3D5C66}
.vc .eyebrow,.mc small,.pinfo small{color:#7F6738}
.mc b,.mc span{color:#0F2F38}
.mc span em{-webkit-text-fill-color:#56737C !important}
.pinfo h3,.pprice b{color:#0F2F38;text-shadow:none}
.pinfo p,.pprice span,.pprice em{color:#3D5C66}
.plink{color:#0B7F75}
.vc .fav{background:rgba(255,255,255,.75)}
/* Foto berlatar gelap: teks menjadi terang */
[data-tone="dark"] h3 button,[data-tone="dark"] .pr b,[data-tone="dark"] b,[data-tone="dark"] h3{color:#fff !important}
[data-tone="dark"] .spec,[data-tone="dark"] .pr small,[data-tone="dark"] .cmp,[data-tone="dark"] p,[data-tone="dark"] .pprice span,[data-tone="dark"] .pprice em{color:rgba(255,255,255,.78) !important}
[data-tone="dark"] .eyebrow,[data-tone="dark"] small{color:#EAD6A6 !important}
[data-tone="dark"] .plink{color:#7FE7DA}
[data-tone="dark"] .mc span em,.mc[data-tone="dark"] span em{-webkit-text-fill-color:rgba(255,255,255,.7) !important}
/* Aplikasi (kartu horizontal): perpanjangan mengalir ke kanan */
html.app #results .vc{background:linear-gradient(90deg,var(--et,#F3F6F7) 0%,var(--eb,#EEF2F3) 45%,color-mix(in srgb,var(--eb,#EEF2F3) 93%,#0E3540) 100%) !important}
html.app #results .vc .ph img{-webkit-box-reflect:none}
.vc:not([data-tone="dark"]) h3 button,.vc:not([data-tone="dark"]) .pr b,.mc:not([data-tone="dark"]) b,.mc:not([data-tone="dark"]) span{color:#0F2F38 !important}
.vc:not([data-tone="dark"]) .spec,.vc:not([data-tone="dark"]) .pr small,.vc:not([data-tone="dark"]) .cmp{color:#3D5C66 !important}

/* ===================== TANPA SEKAT: FOTO DIPERLUAS SEBAGAI LATAR KARTU ===================== */
.vc[data-art],.mc[data-art],.pcard[data-art],.gallery[data-art],html.app #results .vc[data-art]{background:var(--fl) var(--art) top center/100% auto no-repeat !important}
.vc[data-art]{border-color:color-mix(in srgb,var(--fl) 82%,#0E3540)}
.mc[data-art],.pcard[data-art]{border-color:transparent}
.vc[data-art] .ph,.mc[data-art] .mp,.pcard[data-art] .pimg{aspect-ratio:var(--ar);min-height:0;background:transparent !important;border-radius:0}
.gallery[data-art]{aspect-ratio:var(--arg);border:0}
.vc[data-art] .bd{padding-top:6px}
.mc[data-art] .mp{margin:-10px -10px 4px}
/* Koleksi prestise: kartu sejajar, semua tanpa bingkai foto */
.pgrid{grid-template-columns:repeat(4,1fr)}
.pcard.big{grid-column:auto;flex-direction:column}
.pcard.big .pimg{flex:none;min-height:0}
.pcard.big .pinfo{padding:22px 24px 24px}
.pcard.big h3{font-size:1.75rem}
@media (max-width:1100px){.pgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.pgrid{grid-template-columns:1fr}}
/* Aplikasi: hasil pencarian jadi kartu feed vertikal agar perluasan foto utuh */
html.app #results .vc{flex-direction:column}
html.app #results .vc .ph{width:100%;min-height:0}
html.app #results .vc .bd{padding:6px 18px 18px;border-radius:0}
html.app #results .vc .tl .badge.gold{display:inline-flex}
html.app #results .vc[data-art] .ph{aspect-ratio:var(--ar);flex:none;width:100%;min-height:0}

/* ===================== HEADLINE ALPHARD TANPA BINGKAI: SOROTAN DI PANGGUNG ===================== */
.hero-img.art img,.ah-show.art img{background:none !important;border:0 !important;border-radius:0 !important;box-shadow:none !important;padding:0 !important;
  width:100%;height:100%;object-fit:cover;object-position:50% 0%;
  -webkit-mask-image:radial-gradient(ellipse 62% 66% at 50% 40%,#000 52%,rgba(0,0,0,.55) 72%,transparent 100%);
  mask-image:radial-gradient(ellipse 62% 66% at 50% 40%,#000 52%,rgba(0,0,0,.55) 72%,transparent 100%)}
.hero-img.art{aspect-ratio:16/11.5}
.hero-img.art::before{inset:auto 10% 4% 10%;height:26%;background:radial-gradient(closest-side,rgba(59,183,245,.35),transparent);filter:blur(18px)}
.ah-show.art{background:none !important;border:0 !important;box-shadow:none !important;border-radius:0;overflow:visible}
.ah-show.art img{aspect-ratio:16/12;-webkit-mask-image:radial-gradient(ellipse 66% 66% at 50% 40%,#000 50%,rgba(0,0,0,.5) 72%,transparent 100%);mask-image:radial-gradient(ellipse 66% 66% at 50% 40%,#000 50%,rgba(0,0,0,.5) 72%,transparent 100%)}
.ah-stage .ah-cap{margin-top:-6px}
/* Headline: foto asli dengan latar diperluas, tepinya larut ke panggung (tanpa bingkai) */
.hero-img.spot,.ah-show.spot{background:none !important;border:0 !important;box-shadow:none !important;border-radius:0 !important;overflow:visible;aspect-ratio:900/585}
.hero-img.spot img,.ah-show.spot img{width:100%;height:100%;object-fit:cover;background:none !important;border:0 !important;border-radius:0 !important;box-shadow:none !important;padding:0 !important;
  -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 70%,rgba(0,0,0,.6) 84%,transparent 100%);
  mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 70%,rgba(0,0,0,.6) 84%,transparent 100%)}
.hero-img.spot::before{inset:auto 14% 8% 14%;height:22%;background:radial-gradient(closest-side,rgba(59,183,245,.32),transparent);filter:blur(20px)}
.ah-show.spot img{aspect-ratio:900/585}
/* Headline v2: dunia foto Alphard meluas memenuhi sisi kanan panggung dan larut ke gelap */
.hero{position:relative;overflow:hidden}
.hero-grid>div:first-child,.hero .search,.hero .hstats,.hero .ferr{position:relative;z-index:2}
.hero-img.spot{position:absolute !important;top:0;right:0;bottom:0;width:64%;aspect-ratio:auto !important;z-index:0;pointer-events:none}
.hero-img.spot::before{display:none}
.hero-img.spot img{object-fit:cover;object-position:58% 38%;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.35) 16%,#000 36%),linear-gradient(180deg,#000 0%,#000 62%,transparent 100%);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.35) 16%,#000 36%),linear-gradient(180deg,#000 0%,#000 62%,transparent 100%);mask-composite:intersect}
.ah-stage{padding-top:0;overflow:hidden}
.ah-stage .eyebrow{position:relative;z-index:2;margin:0;padding-top:10px}
.ah-show.spot{display:block;margin:-34px -18px 0;aspect-ratio:4/3 !important}
.ah-show.spot img{aspect-ratio:auto !important;height:100%;object-position:50% 40%;
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 16%,#000 60%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,#000 16%,#000 60%,transparent 100%)}
.ah-stage .ah-cap{position:relative;z-index:2;margin-top:-40px}
.ah-stage .eyebrow{display:inline-block;margin-top:10px;padding:5px 11px;border-radius:999px;background:rgba(6,28,36,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
/* Headline v3: transisi sangat halus */
.hero-img.spot{width:68%}
.hero-img.spot img{object-position:56% 42%;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.06) 10%,rgba(0,0,0,.2) 20%,rgba(0,0,0,.42) 30%,rgba(0,0,0,.68) 40%,rgba(0,0,0,.88) 50%,#000 60%),linear-gradient(180deg,rgba(0,0,0,.55) 0%,#000 14%,#000 58%,rgba(0,0,0,.6) 78%,transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.06) 10%,rgba(0,0,0,.2) 20%,rgba(0,0,0,.42) 30%,rgba(0,0,0,.68) 40%,rgba(0,0,0,.88) 50%,#000 60%),linear-gradient(180deg,rgba(0,0,0,.55) 0%,#000 14%,#000 58%,rgba(0,0,0,.6) 78%,transparent 100%)}
.hero::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(6,28,36,.55) 0%,rgba(6,28,36,.25) 32%,rgba(6,28,36,0) 55%)}
.ah-show.spot img{-webkit-mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.5) 10%,#000 24%,#000 56%,rgba(0,0,0,.55) 74%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.5) 10%,#000 24%,#000 56%,rgba(0,0,0,.55) 74%,transparent 100%)}

/* ===================== PETA LOKASI GARASI ===================== */
.mapcard{display:grid;grid-template-columns:1.5fr 1fr;border-radius:28px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.mapbox{position:relative;min-height:340px;background:#DDE9EC}
.mapbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mapinfo{padding:30px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.mapinfo h3{font-family:var(--serif);font-size:1.8rem;font-weight:600}
.mapinfo p{color:var(--ink-2)}
.mapcard.compact{grid-template-columns:1fr}
.mapcard.compact .mapbox{min-height:200px}
.mapcard.compact .mapinfo{padding:18px}
.mapcard.compact .mapinfo h3{font-size:1.35rem}
@media (max-width:860px){.mapcard{grid-template-columns:1fr}.mapbox{min-height:230px}.mapinfo{padding:20px}}
/* Peta ilustrasi (dipakai bila peta Google tidak bisa disematkan) */
.map-fake{position:absolute;inset:0;display:block;text-decoration:none;color:#0F2F38;overflow:hidden;
  background:radial-gradient(circle at 30% 70%,rgba(20,184,166,.18) 0 18%,transparent 19%),radial-gradient(circle at 78% 22%,rgba(59,183,245,.16) 0 14%,transparent 15%),
  repeating-linear-gradient(0deg,transparent 0 46px,rgba(255,255,255,.75) 46px 49px),repeating-linear-gradient(90deg,transparent 0 58px,rgba(255,255,255,.75) 58px 61px),#E2ECEE}
.mf-road{position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(15,47,56,.06)}
.mf-road.r1{left:-10%;right:-10%;top:52%;height:14px;transform:rotate(-8deg);background:#F7E7B8}
.mf-road.r2{top:-10%;bottom:-10%;left:58%;width:11px;transform:rotate(12deg)}
.mf-road.r3{top:-10%;bottom:-10%;left:24%;width:8px;transform:rotate(-20deg)}
.mf-pin{position:absolute;left:50%;top:44%;transform:translate(-50%,-100%);width:54px;height:54px;border-radius:50% 50% 50% 0;rotate:-45deg;background:var(--ig-btn);display:grid;place-items:center;color:#fff;box-shadow:0 10px 24px -8px rgba(14,110,130,.7)}
.mf-pin svg{rotate:45deg}
.mf-pin::after{content:"";position:absolute;width:120px;height:120px;left:50%;top:50%;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(20,184,166,.5);rotate:45deg;animation:mfp 2.4s ease-out infinite}
@keyframes mfp{from{transform:scale(.4);opacity:1}to{transform:scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.mf-pin::after{animation:none}}
.mf-lbl{position:absolute;left:50%;top:calc(44% + 14px);transform:translateX(-50%);background:#fff;padding:7px 14px;border-radius:999px;font-weight:700;font-size:.86rem;white-space:nowrap;box-shadow:0 6px 18px -8px rgba(15,47,56,.4)}
.mf-hint{position:absolute;right:12px;bottom:12px;font-size:.74rem;font-weight:600;background:rgba(255,255,255,.85);padding:5px 10px;border-radius:999px}

</style>

function priceFor(b, st = S){
  const v = st.vehicles.find(x => x.id === b.vid), s = st.settings, motor = v && v.kategori === 'motor';
  const n = b.hari || 0;
  const sewa = (v ? v.harga : 0) * n;
  const sopir = b.paket === 'sopir' ? s.sopir * n : 0;
  const antar = b.ambil && b.ambil.tipe === 'antar' ? s.antar : 0;
  const jemput = b.kembali && b.kembali.tipe === 'jemput' ? s.jemput : 0;
  const perlindungan = b.perlindungan ? (motor ? s.perlindunganMotor : s.perlindunganMobil) * n : 0;
  const promo = b.promo ? st.promos.find(p => p.kode === b.promo && p.aktif) : null;
  const diskon = promo && n >= promo.minHari ? Math.round(sewa * promo.persen / 100) : 0;
  const deposit = b.paket === 'sopir' ? 0 : (motor ? s.depositMotor : s.depositMobil);
  const lebih = b.lebih ? b.lebih.biaya : 0;
  if(b.paket === 'khusus' && b.hargaKhusus) return {khusus:true, sewa:b.hargaKhusus, sopir:0, antar:0, jemput:0, perlindungan:0, diskon:0, deposit:0, lebih, total:b.hargaKhusus + lebih, bayar:b.hargaKhusus + lebih};
  const total = sewa + sopir + antar + jemput + perlindungan - diskon + lebih;
  return {sewa, sopir, antar, jemput, perlindungan, diskon, deposit, lebih, total, bayar: total + deposit};
}

}

function calendarHTML(o){
  const y = o.month.getFullYear(), m = o.month.getMonth();
  const now = new Date(), prevOff = y < now.getFullYear() || (y === now.getFullYear() && m <= now.getMonth());
  const first = new Date(y, m, 1), off = (first.getDay() + 6) % 7, total = new Date(y, m + 1, 0).getDate();
  const picking = o.start && !o.end;
  let h = `<div class="cal${o.readonly ? ' cal-read' : ''}"><div class="cal-h"><button type="button" data-cal="-1" ${prevOff ? 'disabled' : ''} aria-label="Bulan sebelumnya">${ic('chevL', 18)}</button><b>${MONTHS[m]} ${y}</b><button type="button" data-cal="1" aria-label="Bulan berikutnya">${ic('chevR', 18)}</button></div><div class="cal-g">`;
  h += ['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(d => `<div class="cal-dw">${d}</div>`).join('');
  for(let i = 0; i < off; i++) h += '<div></div>';
  for(let d = 1; d <= total; d++){
    const iso = toISO(new Date(y, m, d)), busy = dayBusy(o.vid, iso), past = iso < TODAY;
    let en;
    if(o.readonly) en = false;
    else if(picking){ const endable = iso > o.start && !isBusy(o.vid, o.start, iso); en = !past && (endable || (!busy && iso <= o.start)); }
    else en = !past && !busy;
    const c = ['day'];
    if(busy && !past) c.push('busy');
    if(iso === TODAY) c.push('td');
    if(iso === o.start) c.push('s');
    if(iso === o.end) c.push('e');
    if(o.start && o.end && iso > o.start && iso < o.end) c.push('in');
    const lab = new Date(iso + 'T00:00:00').toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long'}) + (busy ? ', sudah dipesan' : '');
    h += `<button type="button" class="${c.join(' ')}" data-d="${iso}" ${en ? '' : 'disabled'} aria-label="${lab}">${d}</button>`;
  }
  h += `</div><div class="legend"><span><i style="background:var(--primary)"></i>Pilihan Anda</span><span><i style="background:var(--error-bg);border:1px solid var(--error)"></i>Sudah dipesan</span><span><i style="border:1.5px solid var(--line)"></i>Tersedia</span></div></div>`;
  return h;
}

}
function monthly(list, valFn, months = 6){
  const out = [], now = new Date();
  for(let i = months - 1; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1), key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    out.push({l:MONTHS[d.getMonth()].slice(0, 3), v:list.filter(x => x.mulai.slice(0, 7) === key).reduce((a, x) => a + valFn(x), 0)});
  }
  return out;
}

  const n = qDays(), busy = n && isBusy(v.id, Q.mulai, addDays(Q.mulai, n));
  const fav = S.favorit.includes(v.id), cmp = S.banding.includes(v.id), bp = basePrice(v);
  const pk = [v.paket.lepas && 'Lepas kunci', v.paket.sopir && 'Dengan sopir'].filter(Boolean).join(' atau ');
  return `<article class="vc"${edgeAttr(v)}>
    <button class="ph" data-go="kendaraan-${v.id}" aria-label="Lihat detail ${esc(v.nama)}">${artImg(v)}</button>
    <div class="tl">${n ? (busy ? '<span class="badge err">Penuh di tanggal ini</span>' : '<span class="badge ok">Tersedia</span>') : ''}${v.unggulan ? '<span class="badge gold">Unggulan</span>' : ''}</div>
    <button class="fav" data-fav="${v.id}" aria-pressed="${fav}" aria-label="${fav ? 'Hapus dari' : 'Simpan ke'} favorit">${ic('heart', 20)}</button>
    <div class="bd">
      <div><p class="eyebrow">${esc(cat(v.kategori).nama)}</p><h3><button data-go="kendaraan-${v.id}">${esc(v.nama)}</button></h3></div>
      <ul class="spec"><li>${ic('users', 16)}${v.kap} orang</li><li>${ic('gear', 16)}${esc(v.trans)}</li><li>${ic(v.paket.lepas ? 'key' : 'wheel', 16)}${pk}</li></ul>
      <div class="pr"><div><small>${v.paket.lepas ? 'Mulai dari' : 'Termasuk sopir'}</small><b>${rp(bp)}</b><small>per hari${n && !busy ? `, ${rp(bp * n)} untuk ${n} hari` : ''}</small></div>
        ${busy ? `<a class="btn btn-secondary btn-sm" href="#kendaraan-${v.id}">Lihat tanggal</a>` : `<a class="btn btn-primary btn-sm" href="#pesan-${v.id}">Pesan</a>`}</div>
      <label class="cmp"><input type="checkbox" data-cmp="${v.id}" ${cmp ? 'checked' : ''}>Bandingkan</label>
    </div></article>`;
}
const emptyState = (icon, title, text, action = '') => `<div class="empty"><div class="ei">${ic(icon, 28)}</div><b>${title}</b><p>${text}</p>${action}</div>`;

/* Aksi global: buka halaman, favorit, bandingkan */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if(g){ e.preventDefault(); go(g.dataset.go); return; }
  const f = e.target.closest('[data-fav]');
  if(f){ const id = f.dataset.fav, i = S.favorit.indexOf(id);
    if(i >= 0){ S.favorit.splice(i, 1); toast('Dihapus dari favorit'); } else { S.favorit.push(id); toast('Disimpan ke favorit'); }
    save(); $$(`[data-fav="${id}"]`).forEach(b => { b.setAttribute('aria-pressed', String(i < 0)); b.setAttribute('aria-label', (i < 0 ? 'Hapus dari' : 'Simpan ke') + ' favorit'); });
    renderChrome(current.split('-')[0], false); }
});
document.addEventListener('change', e => {
  const c = e.target.closest('[data-cmp]'); if(!c) return;
  const id = c.dataset.cmp, i = S.banding.indexOf(id);
  if(c.checked){ if(S.banding.length >= 3){ c.checked = false; toast('Maksimal 3 kendaraan untuk dibandingkan'); return; } if(i < 0) S.banding.push(id); }
  else if(i >= 0) S.banding.splice(i, 1);
  save(); cmpBar();
});
function cmpBar(){
  const b = $('#cmpbar'), list = S.banding.map(veh).filter(Boolean);
  const show = list.length && ['beranda', 'cari'].includes(current.split('-')[0] || 'beranda');
  b.hidden = !show; if(!show) return;
  b.innerHTML = `<span>${list.length} kendaraan dipilih</span><button class="btn btn-ghost btn-sm" style="color:#fff" id="cmpClear">Hapus</button><button class="btn btn-gold btn-sm" id="cmpOpen" ${list.length < 2 ? 'disabled' : ''}>${ic('columns', 18)}Bandingkan</button>`;
  $('#cmpClear').onclick = () => { S.banding = []; save(); $$('[data-cmp]').forEach(x => x.checked = false); cmpBar(); };
  $('#cmpOpen').onclick = openCompare;
}
function openCompare(){
  const L = S.banding.map(veh).filter(Boolean), s = S.settings;
  const row = (lab, f) => `<tr><th>${lab}</th>${L.map(v => `<td>${f(v)}</td>`).join('')}</tr>`;
  modal('Bandingkan kendaraan', `<div class="scroll-x"><table class="ctable">
    ${row('', v => imgTag(v))}
    ${row('Kendaraan', v => `<b>${esc(v.nama)}</b>`)}
    ${row('Kategori', v => esc(cat(v.kategori).nama))}
    ${row('Harga per hari', v => `<b>${rp(v.harga)}</b>`)}
    ${row('Dengan sopir', v => v.paket.sopir ? rp(v.harga + s.sopir) + ' per hari' : 'Tidak tersedia')}
    ${row('Lepas kunci', v => v.paket.lepas ? 'Bisa' : 'Wajib dengan sopir')}
    ${row('Kapasitas', v => v.kap + ' orang')}
    ${row('Transmisi', v => esc(v.trans))}
    ${row('Bahan bakar', v => esc(v.bbm))}
    ${row('Deposit', v => v.paket.lepas ? rp(isMotor(v) ? s.depositMotor : s.depositMobil) : 'Tidak ada (dengan sopir)')}
    ${row('', v => `<a class="btn btn-primary btn-sm" href="#pesan-${v.id}" data-close>Pesan</a>`)}
  </table></div>`, '', true);
}
