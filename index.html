function filtered(){
  const n = qDays(), q = Q.q.trim().toLowerCase();
  let L = publicVehicles().filter(v =>
    (Q.kat === 'semua' || v.kategori === Q.kat) &&
    (!q || (v.nama + ' ' + cat(v.kategori).nama + ' ' + v.trans).toLowerCase().includes(q)) &&
    (!Q.trans.length || Q.trans.includes(v.trans)) &&
    (!Q.kap || v.kap >= Q.kap) &&
    (!Q.hargaMax || basePrice(v) <= Q.hargaMax) &&
    (!Q.paket || (Q.paket === 'lepas' && v.paket.lepas) || (Q.paket === 'sopir' && v.paket.sopir) || (Q.paket === 'antar' && v.paket.antar)) &&
    (!Q.kota || (partner(v.mitra) || {}).kota === Q.kota) &&
    (!Q.tersedia || !n || !isBusy(v.id, Q.mulai, addDays(Q.mulai, n))));
  const by = {murah:(a, b) => basePrice(a) - basePrice(b), mahal:(a, b) => basePrice(b) - basePrice(a), populer:(a, b) => b.dipesan - a.dipesan, kap:(a, b) => b.kap - a.kap,
    rek:(a, b) => (b.unggulan - a.unggulan) || (b.dipesan - a.dipesan)};
  L.sort(by[Q.sort] || by.rek);
  if(n) L.sort((a, b) => isBusy(a.id, Q.mulai, addDays(Q.mulai, n)) - isBusy(b.id, Q.mulai, addDays(Q.mulai, n)));
  return L;
}
function filterForm(pfx){

  return `<div class="stack" data-filters="${pfx}">
    <div><h4>Tanggal sewa</h4><div class="stack" style="gap:8px">
      <div class="row" style="flex-wrap:nowrap"><input class="field" type="date" name="mulai" min="${TODAY}" value="${Q.mulai}" aria-label="Tanggal mulai"><select class="field tsel" name="jamMulai" aria-label="Jam mulai">${timeOpts(Q.jamMulai)}</select></div>
      <div class="row" style="flex-wrap:nowrap"><input class="field" type="date" name="selesai" min="${addDays(TODAY, 1)}" value="${Q.selesai}" aria-label="Tanggal selesai"><select class="field tsel" name="jamSelesai" aria-label="Jam selesai">${timeOpts(Q.jamSelesai)}</select></div>
      <label class="opt"><input type="checkbox" name="tersedia" ${Q.tersedia ? 'checked' : ''}>Hanya yang tersedia</label></div></div>
    <div><h4>Jenis kendaraan</h4>
      <label class="opt"><input type="radio" name="kat" value="semua" ${Q.kat === 'semua' ? 'checked' : ''}>Semua <span class="muted" style="margin-left:auto">${pub.length}</span></label>
      ${cats.map(c => `<label class="opt"><input type="radio" name="kat" value="${c.id}" ${Q.kat === c.id ? 'checked' : ''}>${esc(c.nama)} <span class="muted" style="margin-left:auto">${pub.filter(v => v.kategori === c.id).length}</span></label>`).join('')}</div>
    <div><h4>Harga per hari maksimal</h4><input type="range" name="hargaMax" min="50000" max="${max}" step="25000" value="${Q.hargaMax || max}" aria-label="Harga maksimal"><p class="hint" data-hmax>${Q.hargaMax && Q.hargaMax < max ? 'Hingga ' + rp(Q.hargaMax) : 'Semua harga'}</p></div>
    <div><h4>Transmisi</h4>${['Matic', 'Manual'].map(t => `<label class="opt"><input type="checkbox" name="trans" value="${t}" ${Q.trans.includes(t) ? 'checked' : ''}>${t}</label>`).join('')}</div>
    <div><h4>Kapasitas penumpang</h4><select class="field" name="kap"><option value="0">Semua</option>${[2, 5, 7, 12].map(k => `<option value="${k}" ${Q.kap === k ? 'selected' : ''}>Minimal ${k} orang</option>`).join('')}</select></div>
    <div><h4>Paket sewa</h4>${[['', 'Semua paket'], ['lepas', 'Lepas kunci'], ['sopir', 'Dengan sopir'], ['antar', 'Bisa diantar ke alamat']].map(p => `<label class="opt"><input type="radio" name="paket" value="${p[0]}" ${Q.paket === p[0] ? 'checked' : ''}>${p[1]}</label>`).join('')}</div>
    ${kota.length > 1 ? `<div><h4>Lokasi</h4><select class="field" name="kota"><option value="">Semua lokasi</option>${kota.map(k => `<option ${Q.kota === k ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select></div>` : ''}
    <button type="button" class="btn btn-secondary" data-reset>Atur ulang filter</button>
  </div>`;
}
function readFilters(box){
  const g = n => box.querySelector(`[name="${n}"]`), r = n => (box.querySelector(`[name="${n}"]:checked`) || {}).value;
  Q.mulai = g('mulai').value; Q.jamMulai = g('jamMulai').value; Q.selesai = g('selesai').value; Q.jamSelesai = g('jamSelesai').value;
  Q.tersedia = g('tersedia').checked; Q.kat = r('kat') || 'semua'; Q.paket = r('paket') || '';
  Q.trans = $$('[name="trans"]:checked', box).map(x => x.value); Q.kap = +g('kap').value;
  const hm = g('hargaMax'); Q.hargaMax = +hm.value >= +hm.max ? 0 : +hm.value;
  if(g('kota')) Q.kota = g('kota').value;
}
function bindFilters(box, onChange){
  box.addEventListener('input', e => {
    if(e.target.name === 'hargaMax'){ const hm = e.target; box.querySelector('[data-hmax]').textContent = +hm.value >= +hm.max ? 'Semua harga' : 'Hingga ' + rp(+hm.value); }
    if(e.target.name === 'mulai'){ const s = box.querySelector('[name="selesai"]'); const n = addDays(e.target.value, 1); s.min = n; if(!s.value || s.value <= e.target.value) s.value = n; }
    readFilters(box); onChange();
  });
  box.querySelector('[data-reset]').onclick = () => { Object.assign(Q, {kat:'semua', q:'', trans:[], kap:0, hargaMax:0, paket:'', kota:'', tersedia:false}); go('cari'); closeModal(); };
}

/* ===================== PEMESANAN ===================== */
let BK = null;
const STEPS = ['Kendaraan', 'Jadwal & lokasi', 'Paket', 'Data diri', 'Tinjau', 'Pembayaran'];
function newBK(v){
  const p = S.profile;

  if(mulai && isBusy(v.id, mulai, addDays(mulai, qDays() || 1))) mulai = selesai = '';

  return {vid:v.id, step:1, ambil:{tipe:Q.lokasi === 'antar' && v.paket.antar ? 'antar' : 'garasi', alamat:''}, kembali:{tipe:'garasi', alamat:''},
    mulai, jamMulai:Q.jamMulai, selesai, jamSelesai:Q.jamSelesai, paket:v.paket.lepas ? 'lepas' : 'sopir', khusus:'', perlindungan:false,
    nama:p.nama, hp:p.hp, email:p.email, catatan:'', simpan:true, promo:'', promoMsg:'', setuju:false, month:m, booking:null, metode:'qris'};
}
const bkDays = () => rentalDays(BK.mulai, BK.jamMulai, BK.selesai, BK.jamSelesai);
const bkObj = () => ({vid:BK.vid, hari:bkDays(), paket:BK.paket, ambil:BK.ambil, kembali:BK.kembali, perlindungan:BK.perlindungan, promo:BK.promo});
ROUTES.pesan = id => {
  const v = veh(id);
  if(!v || !publicVehicles().includes(v)) return notFound('Kendaraan tidak ditemukan', 'Kendaraan ini mungkin sudah tidak tersedia. Silakan pilih kendaraan lain.');
  if(!BK || BK.vid !== id || BK.step >= 6) BK = newBK(v);
  return `<div class="wrap"><div id="bkWrap"></div></div>`;
};
ROUTES.pesan.after = () => { if(BK && $('#bkWrap')) drawBooking(); };
ROUTES.bayar = id => {
  const b = S.bookings.find(x => x.id === id && myBooking(x));
  if(!b) return notFound('Pesanan tidak ditemukan', 'Pesanan ini tidak ada di perangkat Anda.');
  if(b.status !== 'menunggu-bayar') { setTimeout(() => go('akun'), 0); return ''; }
  const v = veh(b.vid) || {};
  BK = Object.assign(newBK(v), {vid:b.vid, step:5, booking:b.id, mulai:b.mulai, jamMulai:b.jamMulai, selesai:b.selesai, jamSelesai:b.jamSelesai, paket:b.paket, ambil:b.ambil, kembali:b.kembali, perlindungan:b.perlindungan, promo:b.promo, nama:b.pelanggan.nama, hp:b.pelanggan.hp});
  return `<div class="wrap"><div id="bkWrap"></div></div>`;
};
ROUTES.bayar.after = () => { if(BK && $('#bkWrap')) drawBooking(); };

function progressHTML(){
  return `<div class="progress" aria-label="Langkah pemesanan">${STEPS.map((s, i) => { const st = i === 0 ? 'done' : (i < BK.step ? 'done' : i === BK.step ? 'on' : ''); return `<div class="${st}" ${i === BK.step ? 'aria-current="step"' : ''}><span>${s}</span><small>${i === 0 || i < BK.step ? 'Selesai' : i === BK.step ? 'Sekarang' : 'Langkah ' + (i + 1)}</small></div>`; }).join('')}</div>`;

function drawBooking(){
  const v = veh(BK.vid), s = S.settings, n = bkDays();

  const isEnd = BK.step >= 6;
  document.body.classList.toggle('booking', !isEnd);
  $('#bkWrap').innerHTML = `

      <div><div class="card pad" id="stepBody">${body}</div>

  const nx = () => nextStep(); const bk = () => { BK.step--; drawBooking(); scrollTo(0, 0); };
  if($('#bkNext')) $('#bkNext').onclick = nx; if($('#bkNextM')) $('#bkNextM').onclick = nx; if($('#bkBack')) $('#bkBack').onclick = bk;
  ({1:bindJadwal, 2:bindPaket, 3:bindData, 4:bindTinjau, 5:bindBayar, 6:bindSelesai})[BK.step]();
}
const refreshSum = () => { const a = $('.book-sum'); if(a) a.innerHTML = summaryHTML(); const m = $('.mbar'); if(m){ const n = bkDays(); m.querySelector('small').textContent = n ? 'Total sewa, ' + n + ' hari' : 'Belum pilih tanggal'; m.querySelector('b').textContent = n ? rp(priceFor(bkObj()).total) : '-'; } };

      ${v.paket.antar ? `<label class="choice"><input type="radio" name="ambil" value="antar" ${BK.ambil.tipe === 'antar' ? 'checked' : ''}><span><b>Diantar ke alamat saya</b><small>Kendaraan diantar sesuai jam ambil</small></span><span class="price">${rp(s.antar)}</span></label>` : ''}

      <div class="fi" id="ambilAlamat" ${BK.ambil.tipe === 'antar' ? '' : 'hidden'}><label class="l" for="aAlamat">Alamat pengantaran</label><input class="field" id="aAlamat" value="${esc(BK.ambil.alamat)}" placeholder="Nama jalan, nomor rumah, patokan"></div>

function durInfo(){

function bindJadwal(){

function nextStep(){

    if(!BK.mulai || !BK.selesai || n < 1 || isBusy(BK.vid, BK.mulai, addDays(BK.mulai, n))){ durInfo(); if(!BK.mulai || !BK.selesai) toast('Pilih tanggal ambil dan kembali terlebih dahulu', 'err'); ok = false; }
    if(!ok){ const f = $('.invalid'); if(f) f.focus(); return; }
  }
  if(BK.step === 2 && BK.paket === 'khusus' && !fieldErr($('#khusus'), BK.khusus.trim().length < 10 ? 'Jelaskan kebutuhan Anda minimal satu kalimat.' : '')) return;

    if(BK.simpan){ Object.assign(S.profile, {nama:BK.nama.trim(), hp:BK.hp.trim(), email:BK.email.trim()}); save(); }
  }
  if(BK.step === 4){
    if(!BK.setuju){ fieldErr($('#setuju'), 'Centang persetujuan untuk melanjutkan.'); return; }
    if(isBusy(BK.vid, BK.mulai, addDays(BK.mulai, n))){ toast('Tanggal ini baru saja terisi. Silakan pilih tanggal lain.', 'err'); BK.step = 1; drawBooking(); return; }
    const b = {id:uid('ST-'), dibuat:new Date().toISOString(), milikSaya:true, vid:BK.vid, pelanggan:{nama:BK.nama.trim(), hp:BK.hp.trim(), email:BK.email.trim()},

      deposit:{status:'belum'}, kerusakan:[], serah:null, lebih:null, ulasan:null};
    b.harga = priceFor(b); S.bookings.unshift(b); v.dipesan++;
    notify(`Pesanan ${b.id} untuk ${v.nama} dibuat.`); notify(`Pesanan baru ${b.id}: ${v.nama}, ${fmtD(b.mulai)}.`, 'ops');

/* Latar perpanjangan foto: salinan foto yang diperbesar dan diburamkan */
/* Perpanjangan foto yang realistis: warna latar & lantai diambil dari tepi atas dan bawah foto */
function edgeOf(v){ return (v && v.edge) || (v && EDGE[v.foto]) || {t:'#F3F6F7', b:'#EEF2F3', dark:false}; }
const edgeAttr = v => { const a = ART.get(photo(v)); if(a) return ` data-art style="--art:url(${a.url});--fl:${a.fl};--ar:${a.ar};--arg:${a.arg}"${a.dark ? ' data-tone="dark"' : ''}`;
  const e = edgeOf(v); return ` style="--et:${e.t};--eb:${e.b}"${e.dark ? ' data-tone="dark"' : ''}`; };
const artImg = v => ART.has(photo(v)) ? '' : imgTag(v);

/* ===== Foto diperluas secara nyata: tepi foto diteruskan, lantai + pantulan, tanpa bingkai ===== */
const ART = new Map();
function buildArt(src){
  if(!src || ART.has(src)) return Promise.resolve();
  return new Promise(res => {
    const im = new Image();
    im.onerror = () => res();
    im.onload = () => {
      try{
        const w = im.naturalWidth, h = im.naturalHeight, px = Math.round(w * .1), W = w + 2 * px, ext = Math.round(h * 1.3), H = h + ext;
        const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
        /* warna lantai: diambil dari baris bawah foto (abaikan piksel ban/bayangan yang gelap) */
        const s0 = document.createElement('canvas'); s0.width = w; s0.height = 1; const sx = s0.getContext('2d'); sx.drawImage(im, 0, h - 1, w, 1, 0, 0, w, 1);
        const bd = sx.getImageData(0, 0, w, 1).data, px3 = [];
        for(let i = 0; i < bd.length; i += 4) px3.push([bd[i], bd[i + 1], bd[i + 2], .2126 * bd[i] + .7152 * bd[i + 1] + .0722 * bd[i + 2]]);
        px3.sort((p, q) => p[3] - q[3]); const f0 = px3[Math.floor(px3.length * .72)];
        x.fillStyle = `rgb(${f0[0]},${f0[1]},${f0[2]})`; x.fillRect(0, h - 2, W, ext + 2);
        /* sisi kiri & kanan: kolom tepi diteruskan */
        x.drawImage(im, 0, 0, 2, h, 0, 0, px + 1, h); x.drawImage(im, w - 2, 0, 2, h, px + w - 1, 0, px + 1, h);
        /* foto asli, bagian bawahnya memudar ke lantai agar tanpa sambungan */
        const t = document.createElement('canvas'); t.width = w; t.height = h; const tx = t.getContext('2d');
        tx.drawImage(im, 0, 0);
        tx.globalCompositeOperation = 'destination-in';
        let g = tx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#000'); g.addColorStop(.94, '#000'); g.addColorStop(1, 'rgba(0,0,0,0)');
        tx.fillStyle = g; tx.fillRect(0, 0, w, h);
        x.drawImage(t, px, 0);
        /* pantulan di lantai */
        const r = document.createElement('canvas'); r.width = w; r.height = h; const rx = r.getContext('2d');
        rx.translate(0, h); rx.scale(1, -1); rx.drawImage(im, 0, 0); rx.setTransform(1, 0, 0, 1, 0, 0);
        rx.globalCompositeOperation = 'destination-in';
        g = rx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, 'rgba(0,0,0,.24)'); g.addColorStop(.5, 'rgba(0,0,0,0)');
        rx.fillStyle = g; rx.fillRect(0, 0, w, h);
        x.filter = 'blur(1.5px)'; x.drawImage(r, px, h - 4); x.filter = 'none';
        /* lantai menyatu ke satu warna di bawah */
        let R = Math.round(f0[0] * .95), G = Math.round(f0[1] * .95), B = Math.round(f0[2] * .95);
        g = x.createLinearGradient(0, h, 0, H); g.addColorStop(0, `rgba(${R},${G},${B},0)`); g.addColorStop(.45, `rgba(${R},${G},${B},.35)`); g.addColorStop(1, `rgb(${R},${G},${B})`);
        x.fillStyle = g; x.fillRect(0, h, W, ext);
        const hex = '#' + [R, G, B].map(v => v.toString(16).padStart(2, '0')).join('');
        let url = c.toDataURL('image/webp', .8); if(!url.startsWith('data:image/webp')) url = c.toDataURL('image/jpeg', .85);
        ART.set(src, {url, fl:hex, ar:(W / h).toFixed(4), arg:(W / (h * 1.5)).toFixed(4), dark:(.2126 * R + .7152 * G + .0722 * B) / 255 < .45});
      }catch(e){}
      res();
    };
    im.src = src;
  });
}
const prepArt = () => Promise.all([...new Set(S.vehicles.map(photo).filter(Boolean))].map(buildArt));

/* Unggah foto: dikompres di perangkat (siap dipindah ke Supabase Storage) */
let lastEdge = null;
function readPhoto(file){
  return new Promise((res, rej) => {
    if(!file) return rej('Tidak ada file.');
    if(!/^image\//.test(file.type)) return rej('File harus berupa gambar (JPG, PNG, atau WebP).');
    if(file.size > 10 * 1024 * 1024) return rej('Ukuran foto maksimal 10 MB.');
    const r = new FileReader();
    r.onerror = () => rej('Foto gagal dibaca.');
    r.onload = () => { const im = new Image(); im.onerror = () => rej('Format foto tidak dikenali.');
      im.onload = () => { const k = Math.min(1, 640 / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
        let d = c.toDataURL('image/webp', .78); if(!d.startsWith('data:image/webp')) d = c.toDataURL('image/jpeg', .8);
        const row = y => { const px = x.getImageData(0, y, c.width, Math.min(4, c.height - y)).data; const ch = [[], [], []]; for(let i = 0; i < px.length; i += 4){ ch[0].push(px[i]); ch[1].push(px[i + 1]); ch[2].push(px[i + 2]); } return ch.map(a => a.sort((p, q) => p - q)[a.length >> 1]); };
        const hex = a => '#' + a.map(n => n.toString(16).padStart(2, '0')).join(''), t = row(0), bt = row(Math.max(0, c.height - 4));
        lastEdge = {t:hex(t), b:hex(bt), dark:(.2126 * bt[0] + .7152 * bt[1] + .0722 * bt[2]) / 255 < .45}; res(d); };
      im.src = r.result; };
    r.readAsDataURL(file);
  });
}

function vehicleToday(v){
  const bk = S.bookings.find(b => b.vid === v.id && b.status === 'berjalan');
  if(bk) return ['Sedang disewa', 'ok', bk];
  const bl = S.blocks.find(b => b.vid === v.id && b.from <= TODAY && TODAY < b.to);
  if(bl) return [bl.jenis === 'perawatan' ? 'Perawatan' : 'Ditutup', 'warn', null];
  if(dayBusy(v.id, TODAY)) return ['Dipesan hari ini', 'info', null];
  return ['Tersedia', '', null];
}

    const util = Math.round(used / Math.max(1, S.vehicles.length * 30) * 100);
    const top = S.vehicles.slice().sort((a, b) => b.dipesan - a.dipesan).slice(0, 5);
    body = head('Laporan operasional', 'Ringkasan bulan ' + MONTHS[new Date().getMonth()] + '.') + `<div class="kpis">${kpi('Pesanan bulan ini', L.length)}${kpi('Pendapatan lunas', rp(L.reduce((a, b) => a + paidRev(b), 0)))}${kpi('Utilisasi armada 30 hari', util + '%', used + ' hari-unit tersewa')}${kpi('Rata-rata durasi', (S.bookings.length ? (S.bookings.reduce((a, b) => a + b.hari, 0) / S.bookings.length).toFixed(1) : 0) + ' hari')}</div>

function opsModal(id){

      ${b.bayar.status !== 'lunas' ? `<label><input type="checkbox" class="hc">Pembayaran sewa ${rp(h.total)} sudah diterima</label>` : ''}</div>
    <div class="grid2"><div class="fi"><label class="l" for="oKm">Kilometer awal</label><input class="field" id="oKm" type="number" min="0" inputmode="numeric"></div><div class="fi"><label class="l" for="oBbm">Bahan bakar</label><select class="field" id="oBbm"><option>Penuh</option><option>3/4</option><option>1/2</option><option>1/4</option></select></div></div>
    <button class="btn btn-primary" id="oSerah" style="justify-self:start">${ic('key', 18)}Serahkan kendaraan</button>`);
  if(b.status === 'berjalan') html += sec('Pengembalian', `${b.serah ? `<p class="muted" style="font-size:.9rem">Diserahkan ${fmtDT(b.serah.t)}, km ${b.serah.km}, BBM ${b.serah.bbm}.</p>` : ''}
    <div class="grid2"><div class="fi"><label class="l" for="oRd">Tanggal kembali aktual</label><input class="field" type="date" id="oRd" value="${TODAY}"></div><div class="fi"><label class="l" for="oRt">Jam kembali aktual</label><input class="field" type="time" id="oRt" value="${new Date().toTimeString().slice(0, 5)}"></div></div>

    <div class="fi"><label class="l">Laporan kerusakan</label><div class="row" style="flex-wrap:nowrap"><input class="field" id="oDmg" placeholder="Kosongkan jika tidak ada"><input class="field" id="oDmgC" type="number" min="0" step="10000" placeholder="Biaya" style="width:140px"></div></div>
    ${h.deposit ? `<div class="fi"><label class="l" for="oDep">Deposit ${rp(h.deposit)}</label><select class="field" id="oDep"><option value="kembali">Dikembalikan penuh</option><option value="potong">Dipotong biaya kerusakan atau kelebihan waktu</option></select></div>` : ''}

  if(['dikonfirmasi', 'berjalan'].includes(b.status)) html += sec('Perpanjang sewa', `<div class="grid2"><div class="fi"><label class="l" for="oXd">Tanggal kembali baru</label><input class="field" type="date" id="oXd" min="${addDays(b.selesai, 1)}" value="${addDays(b.selesai, 1)}"></div><div class="fi"><label class="l" for="oXt">Jam kembali</label><select class="field" id="oXt">${timeOpts(b.jamSelesai)}</select></div></div><p class="hint" id="oXinfo"></p><button class="btn btn-secondary" id="oExt" style="justify-self:start">Perpanjang</button>`);

  }

function customersList(){
  const map = {};
  S.bookings.forEach(b => { const k = normHp(b.pelanggan.hp); if(!map[k]) map[k] = {nama:b.pelanggan.nama, hp:b.pelanggan.hp, n:0, total:0, last:'', contoh:b.contoh}; const c = map[k]; c.n++; c.total += paidRev(b); if(b.mulai > c.last) c.last = b.mulai; });
  if(S.profile.hp && !map[normHp(S.profile.hp)]) map[normHp(S.profile.hp)] = {nama:S.profile.nama, hp:S.profile.hp, n:0, total:0, last:''};
  return Object.values(map);
}

    body = head('Pelanggan', 'Daftar penyewa dari riwayat pesanan.') + tbl(['Nama', 'WhatsApp', '#Pesanan', '#Total belanja', 'Terakhir sewa', 'Verifikasi'], L.map(c => `<tr><td><b>${esc(c.nama)}</b>${c.contoh ? '<br><small class="muted">contoh</small>' : ''}</td><td>${esc(c.hp)}</td><td class="num">${c.n}</td><td class="num">${rp(c.total)}</td><td>${c.last ? fmtD(c.last) : '-'}</td><td>${normHp(c.hp) === normHp(S.profile.hp) ? `<span class="badge ${S.profile.verifikasi === 'terverifikasi' ? 'ok' : S.profile.verifikasi === 'menunggu' ? 'warn' : ''}">${{belum:'Belum', menunggu:'Menunggu', terverifikasi:'Terverifikasi', ditolak:'Ditolak'}[S.profile.verifikasi]}</span>` : '<span class="muted">-</span>'}</td></tr>`),
      emptyState('users', 'Belum ada pelanggan', 'Pelanggan muncul setelah membuat pesanan.'));
  }
  if(tab === 'promo'){
    body = head('Promo', 'Promo aktif tampil di beranda dan bisa dipakai saat meninjau pesanan.') + `<div class="two" style="align-items:start">
      <form class="card pad stack" id="prForm"><h3>Buat promo</h3><div class="grid2"><div class="fi"><label class="l" for="prK">Kode</label><input class="field" id="prK" placeholder="HEMAT10" style="text-transform:uppercase"></div><div class="fi"><label class="l" for="prP">Potongan (%)</label><input class="field" id="prP" type="number" min="1" max="90" value="10"></div></div>
        <div class="fi"><label class="l" for="prJ">Judul promo</label><input class="field" id="prJ" placeholder="Hemat 10% sewa 3 hari"></div><div class="fi"><label class="l" for="prM">Minimal sewa (hari)</label><input class="field" id="prM" type="number" min="1" value="1"></div><button class="btn btn-primary" type="submit">Simpan promo</button></form>
      <div>${tbl(['Kode', 'Promo', 'Aktif', ''], S.promos.map((p, i) => `<tr><td><b>${esc(p.kode)}</b></td><td>${esc(p.judul)}<br><small class="muted">${p.persen}%, min ${p.minHari} hari</small></td><td><input type="checkbox" data-prA="${i}" ${p.aktif ? 'checked' : ''} aria-label="Aktifkan ${esc(p.kode)}" style="width:20px;height:20px;accent-color:var(--ink)"></td><td><button class="btn btn-ghost btn-sm" data-prD="${i}" aria-label="Hapus ${esc(p.kode)}">${ic('trash', 16)}</button></td></tr>`), emptyState('megaphone', 'Belum ada promo', 'Buat promo pertama Anda.'))}</div></div>`;
  }
  if(tab === 'kategori'){
    const icons = ['car', 'bike', 'bus', 'truck', 'crown', 'zap', 'briefcase', 'users'];
    body = head('Kategori kendaraan', 'Kategori yang disembunyikan tidak tampil ke pelanggan beserta kendaraannya.') + `<div class="two" style="align-items:start">
      <div>${tbl(['Kategori', '#Kendaraan', 'Tampil'], S.cats.map((c, i) => `<tr><td><span class="row" style="flex-wrap:nowrap">${ic(c.ikon, 18)}${esc(c.nama)}</span></td><td class="num">${S.vehicles.filter(v => v.kategori === c.id).length}</td><td><input type="checkbox" data-catT="${i}" ${c.tampil ? 'checked' : ''} aria-label="Tampilkan ${esc(c.nama)}" style="width:20px;height:20px;accent-color:var(--ink)"></td></tr>`), '')}</div>
      <form class="card pad stack" id="catForm"><h3>Tambah kategori</h3><div class="fi"><label class="l" for="ctN">Nama kategori</label><input class="field" id="ctN" placeholder="Contoh: Mobil listrik"></div><div class="fi"><label class="l" for="ctI">Ikon</label><select class="field" id="ctI">${icons.map(x => `<option>${x}</option>`).join('')}</select></div><button class="btn btn-primary" type="submit">Tambah</button></form></div>`;
  }
  if(tab === 'dukungan'){
    body = head('Dukungan pelanggan', 'Pertanyaan dari halaman Bantuan.') + tbl(['Waktu', 'Pelanggan', 'Topik', 'Pesan', 'Status', ''], S.tickets.map((t, i) => `<tr><td>${fmtDT(t.t)}</td><td>${esc(t.nama)}<br><small class="muted">${esc(t.hp)}</small></td><td>${esc(t.topik)}</td><td class="wrap" style="max-width:320px">${esc(t.pesan)}</td><td><select class="field" data-tk="${i}" style="width:auto">${['baru', 'diproses', 'selesai'].map(s => `<option value="${s}" ${t.status === s ? 'selected' : ''}>${s[0].toUpperCase() + s.slice(1)}</option>`).join('')}</select></td><td><a class="btn btn-secondary btn-sm" href="${waLink(normHp(t.hp).replace(/^0/, '62'), `Halo ${t.nama}, menanggapi pertanyaan Anda tentang ${t.topik.toLowerCase()}:`)}" target="_blank" rel="noopener">${ic('wa', 16)}Balas</a></td></tr>`),
      emptyState('headset', 'Belum ada pertanyaan', 'Pertanyaan yang dikirim lewat halaman Bantuan akan masuk ke sini.'));
  }
  if(tab === 'pengaturan'){
    const s = S.settings, n = (id, l, v, step = 5000) => `<div class="fi"><label class="l" for="${id}">${l}</label><input class="field" type="number" min="0" step="${step}" id="${id}" value="${v}"></div>`;
    body = head('Pengaturan sistem', 'Berlaku untuk seluruh pesanan baru.') + `<form class="stack" id="setForm" style="max-width:860px">
      <div class="card pad stack"><h3>Usaha</h3><div class="grid2"><div class="fi"><label class="l" for="sNama">Nama usaha</label><input class="field" id="sNama" value="${esc(s.nama)}"></div><div class="fi"><label class="l" for="sWa">Nomor WhatsApp admin (format 62…)</label><input class="field" id="sWa" value="${esc(s.wa)}" inputmode="numeric"></div></div>
        <div class="fi"><label class="l" for="sAlamat">Alamat garasi</label><input class="field" id="sAlamat" value="${esc(s.alamat)}"></div><div class="fi"><label class="l" for="sJam">Jam operasional</label><input class="field" id="sJam" value="${esc(s.jam)}"></div>
        <div class="grid3"><div class="fi" style="grid-column:span 1"><label class="l" for="sMaps">Tautan Google Maps</label><input class="field" id="sMaps" value="${esc(s.maps || '')}"></div><div class="fi"><label class="l" for="sLat">Lintang (latitude)</label><input class="field" id="sLat" value="${s.lat ?? ''}"></div><div class="fi"><label class="l" for="sLng">Bujur (longitude)</label><input class="field" id="sLng" value="${s.lng ?? ''}"></div></div></div>
      <div class="card pad stack"><h3>Biaya</h3><div class="grid3">${n('sSopir', 'Sopir per hari', s.sopir)}${n('sAntar', 'Antar ke alamat', s.antar)}${n('sJemput', 'Jemput dari alamat', s.jemput)}${n('sDepM', 'Deposit motor', s.depositMotor, 50000)}${n('sDepC', 'Deposit mobil', s.depositMobil, 50000)}${n('sKom', 'Komisi default (%)', s.komisi, 1)}${n('sPerM', 'Perlindungan motor / hari', s.perlindunganMotor, 1000)}${n('sPerC', 'Perlindungan mobil / hari', s.perlindunganMobil, 1000)}<div></div>${n('sLbM', 'Kelebihan waktu motor / jam', s.lebihJamMotor, 1000)}${n('sLbC', 'Kelebihan waktu mobil / jam', s.lebihJamMobil, 1000)}</div></div>
      <div class="card pad stack"><h3>Ketentuan</h3><div class="fi"><label class="l" for="sSyarat">Syarat sewa (satu baris satu syarat)</label><textarea class="field" id="sSyarat" rows="6">${esc(s.syarat.join('\n'))}</textarea></div><div class="fi"><label class="l" for="sBatal">Kebijakan pembatalan</label><textarea class="field" id="sBatal">${esc(s.batal)}</textarea></div></div>
      <button class="btn btn-primary" type="submit" style="justify-self:start">Simpan pengaturan</button></form>`;
  }
  if(tab === 'data'){
    let size = 0; try{ size = (localStorage.getItem(KEY) || '').length; }catch(e){}
    body = head('Data demo', 'Penjelasan penyimpanan pada prototipe ini.') + `<div class="stack" style="max-width:760px">
      <div class="alert info">${ic('db', 18)}<span>Semua data prototipe tersimpan di browser perangkat ini (sekitar ${Math.round(size / 1024)} KB). Data tidak tersinkron antarperangkat. Pesanan bertanda “contoh” adalah data peraga.</span></div>
      <div class="card pad stack"><h3>Kembalikan data contoh</h3><p class="muted">Menghapus semua pesanan, kendaraan tambahan, pengaturan, dan profil di perangkat ini, lalu memuat ulang data contoh.</p><button class="btn btn-danger" id="resetDemo" style="justify-self:start">${ic('refresh', 18)}Atur ulang data demo</button></div></div>`;
  }
  return bizLayout('admin', 'Super Admin', S.settings.nama, items, tab, body);
};
ROUTES.admin.after = () => {
  bindBizTabs('admin');
  const af = $('#admF'); if(af) af.onchange = () => { S.ui.admF = af.value; render(); };
  $$('[data-kom]').forEach(i => i.onchange = () => { const n = +i.value; if(!(n >= 0 && n <= 50)){ toast('Komisi 0–50%', 'err'); return; } partner(i.dataset.kom).komisi = n; save(); toast('Komisi diperbarui'); });
  const ap = $('#addP'); if(ap) ap.onclick = () => {
    modal('Tambah mitra', `<form class="stack" id="regForm2" novalidate><div class="fi"><label class="l" for="rNama">Nama usaha rental</label><input class="field" id="rNama"></div>
      <div class="grid2"><div class="fi"><label class="l" for="rPem">Nama pemilik</label><input class="field" id="rPem"></div><div class="fi"><label class="l" for="rHp">Nomor WhatsApp</label><input class="field" id="rHp" inputmode="tel"></div></div>
      <div class="grid2"><div class="fi"><label class="l" for="rKota">Kota</label><input class="field" id="rKota"></div><div class="fi"><label class="l" for="rKom">Komisi (%)</label><input class="field" id="rKom" type="number" min="0" max="50" value="${S.settings.komisi}"></div></div></form>`,
      `<button class="btn btn-secondary" data-close>Batal</button><button class="btn btn-primary" id="rSave">Simpan mitra</button>`);
    $('#rSave').onclick = () => {
      const n = $('#rNama').value.trim(), pm = $('#rPem').value.trim(), h = $('#rHp').value.trim(), k = $('#rKota').value.trim(), km = +$('#rKom').value;
      const ok = [fieldErr($('#rNama'), n.length < 3 ? 'Isi nama usaha.' : ''), fieldErr($('#rPem'), pm.length < 3 ? 'Isi nama pemilik.' : ''), fieldErr($('#rHp'), !validHp(h) ? 'Isi nomor WhatsApp yang aktif.' : ''), fieldErr($('#rKota'), k.length < 3 ? 'Isi kota.' : ''), fieldErr($('#rKom'), !(km >= 0 && km <= 50) ? 'Komisi 0–50%.' : '')].every(Boolean);
      if(!ok) return;
      S.partners.push({id:uid('P'), nama:n, pemilik:pm, hp:h, kota:k, status:'aktif', komisi:km, dibuat:new Date().toISOString()}); save(); closeModal(); toast('Mitra ditambahkan'); render();
    };
  };
  $$('[data-pst]').forEach(b => b.onclick = () => { const [id, st] = b.dataset.pst.split(':'); partner(id).status = st; save(); toast('Status mitra diperbarui'); render(); });
  $$('[data-vst]').forEach(b => b.onclick = () => { const [id, st] = b.dataset.vst.split(':'); veh(id).status = st; save(); toast(st === 'disetujui' ? 'Kendaraan disetujui' : 'Kendaraan ditolak'); render(); });
  $$('[data-ung]').forEach(i => i.onchange = () => { veh(i.dataset.ung).unggulan = i.checked; save(); toast('Kendaraan unggulan diperbarui'); });
  $$('[data-editv]').forEach(b => b.onclick = () => { const v = veh(b.dataset.editv); vehicleForm(v, v.mitra, () => render()); });
  const pr = $('#prForm'); if(pr) pr.onsubmit = e => { e.preventDefault();
    const k = $('#prK').value.trim().toUpperCase(), p = +$('#prP').value, j = $('#prJ').value.trim(), m = +$('#prM').value;
    const ok = [fieldErr($('#prK'), !/^[A-Z0-9]{3,15}$/.test(k) ? 'Kode 3–15 huruf atau angka.' : S.promos.some(x => x.kode === k) ? 'Kode sudah dipakai.' : ''), fieldErr($('#prP'), !(p >= 1 && p <= 90) ? 'Potongan 1–90%.' : ''), fieldErr($('#prJ'), j.length < 5 ? 'Isi judul promo.' : ''), fieldErr($('#prM'), !(m >= 1) ? 'Minimal 1 hari.' : '')].every(Boolean);
    if(!ok) return; S.promos.push({kode:k, judul:j, persen:p, minHari:m, aktif:true}); save(); toast('Promo disimpan'); render(); };
  $$('[data-prA]').forEach(i => i.onchange = () => { S.promos[+i.dataset.pra].aktif = i.checked; save(); toast('Promo diperbarui'); });
  $$('[data-prD]').forEach(b => b.onclick = () => { S.promos.splice(+b.dataset.prd, 1); save(); toast('Promo dihapus'); render(); });
  $$('[data-catT]').forEach(i => i.onchange = () => { S.cats[+i.dataset.catt].tampil = i.checked; save(); toast('Kategori diperbarui'); });
  const cf = $('#catForm'); if(cf) cf.onsubmit = e => { e.preventDefault(); const n = $('#ctN').value.trim(); const id = n.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    if(!fieldErr($('#ctN'), n.length < 3 ? 'Isi nama kategori.' : S.cats.some(c => c.id === id) ? 'Kategori sudah ada.' : '')) return;
    S.cats.push({id, nama:n, ikon:$('#ctI').value, tampil:true}); save(); toast('Kategori ditambahkan'); render(); };
  $$('[data-tk]').forEach(s => s.onchange = () => { S.tickets[+s.dataset.tk].status = s.value; save(); toast('Status pertanyaan diperbarui'); });
  const sf = $('#setForm'); if(sf) sf.onsubmit = e => { e.preventDefault();
    let wa = $('#sWa').value.replace(/\D/g, ''); if(wa.startsWith('0')) wa = '62' + wa.slice(1);
    if(!fieldErr($('#sWa'), !/^62\d{8,13}$/.test(wa) ? 'Nomor WhatsApp belum valid.' : '')) return;
    const g = id => +$('#' + id).value || 0;
    Object.assign(S.settings, {nama:$('#sNama').value.trim() || 'Syailun Trans', wa, alamat:$('#sAlamat').value.trim(), jam:$('#sJam').value.trim(), sopir:g('sSopir'), antar:g('sAntar'), jemput:g('sJemput'), depositMotor:g('sDepM'), depositMobil:g('sDepC'), komisi:g('sKom'), perlindunganMotor:g('sPerM'), perlindunganMobil:g('sPerC'), lebihJamMotor:g('sLbM'), lebihJamMobil:g('sLbC'),
      syarat:$('#sSyarat').value.split('\n').map(x => x.trim()).filter(Boolean), batal:$('#sBatal').value.trim(),
      maps:$('#sMaps').value.trim(), lat:parseFloat($('#sLat').value) || S.settings.lat, lng:parseFloat($('#sLng').value) || S.settings.lng});
    const p1 = S.partners.find(p => p.utama); if(p1){ p1.nama = S.settings.nama; p1.hp = wa; }
    save(); toast('Pengaturan disimpan'); render(); };
  const rd = $('#resetDemo'); if(rd) rd.onclick = () => confirmBox('Atur ulang data demo?', 'Semua perubahan di perangkat ini akan hilang.', 'Atur ulang', () => { S = seed(); save(); BK = null; toast('Data demo dipulihkan'); render(); }, true);
};

/* ===== Pintu masuk: Super Admin & Admin ===== */
ROUTES.superadmin = ROUTES.admin;
const MITRA_VIEW = ROUTES.mitra, OPS_VIEW = ROUTES.operasional;
const ADMIN_TABS = [
  ['hariini', 'layout', 'Hari ini', 'ops', 'ringkasan'], ['reservasi', 'ticket', 'Reservasi', 'ops', 'reservasi'],
  ['kendaraan', 'car', 'Kendaraan', 'mitra', 'kendaraan'], ['kalender', 'calendar', 'Kalender', 'mitra', 'kalender'],
  ['armada', 'clip', 'Status armada', 'ops', 'armada'], ['perawatan', 'wrench', 'Perawatan', 'ops', 'perawatan'],
  ['verifikasi', 'idcard', 'Verifikasi pelanggan', 'ops', 'verifikasi'], ['usaha', 'chart', 'Ringkasan usaha', 'mitra', 'ringkasan'],
  ['pendapatan', 'wallet', 'Pendapatan', 'mitra', 'pendapatan'], ['laporan', 'chart', 'Laporan', 'ops', 'laporan'], ['profil', 'store', 'Profil usaha', 'mitra', 'profil']];
ROUTES.admin = () => {
  const tab = ADMIN_TABS.find(t => t[0] === S.ui.adminGabungTab) || ADMIN_TABS[0];
  let html;
  if(tab[3] === 'ops'){ S.ui.operasionalTab = tab[4]; html = OPS_VIEW(); } else { S.ui.mitraTab = tab[4]; html = MITRA_VIEW(); }
  const i = html.indexOf('<main class="bmain">'), j = html.lastIndexOf('</main>');
  const body = html.slice(i + '<main class="bmain">'.length, j);
  const pend = S.bookings.filter(b => b.status === 'menunggu-bayar' || b.status === 'menunggu-penawaran').length, ver = S.profile.verifikasi === 'menunggu' ? 1 : 0;
  const items = ADMIN_TABS.map(t => [t[0], t[1], t[2], t[0] === 'reservasi' ? pend : t[0] === 'verifikasi' ? ver : 0]);
  return bizLayout('admin', S.settings.nama, 'Admin', items, tab[0], body);
};
ROUTES.admin.after = () => {
  const tab = ADMIN_TABS.find(t => t[0] === S.ui.adminGabungTab) || ADMIN_TABS[0];
  (tab[3] === 'ops' ? OPS_VIEW : MITRA_VIEW).after();
  $$('[data-btab]').forEach(b => b.onclick = () => { S.ui.adminGabungTab = b.dataset.btab; save(); render(); });
};
ROUTES.mitra = () => { setTimeout(() => go('admin'), 0); return ''; };
ROUTES.operasional = () => { setTimeout(() => go('admin'), 0); return ''; };

/* ===== Mulai ===== */
if('serviceWorker' in navigator && location.protocol === 'https:'){ navigator.serviceWorker.register('sw.js').catch(() => {}); }
load();
prepArt().then(render);

</script>
</body>
